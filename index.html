<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TG Bot Platform Ultra - Android Edition</title>
    <meta name="theme-color" content="#17212b">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0e1621;
            --bg-sidebar: #17212b;
            --bg-chat: #0e1621;
            --bg-header: #17212b;
            --bg-input: #17212b;
            --bg-msg-in: #182533;
            --bg-msg-out: #2b5278;
            --text-main: #f5f5f5;
            --text-sub: #7f91a4;
            --accent: #2aabee;
            --accent-hover: #229ed9;
            --border-color: #101921;
            --online-color: #4cd964;
            --shadow-color: rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* App Layout Container */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar / Chat List */
        .sidebar {
            width: 100%;
            height: 100%;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            z-index: 10;
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            position: absolute;
            left: 0;
            top: 0;
        }

        @media (min-width: 768px) {
            .sidebar {
                width: 380px;
                position: relative;
                border-right: 1px solid var(--border-color);
                transform: none !important;
            }
        }

        /* Sidebar Header */
        .sidebar-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-sidebar);
            box-shadow: 0 2px 4px var(--shadow-color);
            z-index: 2;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--accent);
        }

        .search-box {
            padding: 10px 16px;
            background: #101921;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input-wrapper i {
            position: absolute;
            left: 12px;
            color: var(--text-sub);
        }

        .search-input {
            width: 100%;
            padding: 9px 12px 9px 38px;
            background-color: #242f3d;
            border: none;
            border-radius: 20px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        /* Bot List */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.15);
            transition: background 0.15s ease;
        }

        .chat-item:active, .chat-item.active {
            background-color: #202b36;
        }

        .bot-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: #fff;
            position: relative;
            flex-shrink: 0;
            background: linear-gradient(135deg, #36d1dc, #5b86e5);
        }

        .bot-online-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            background-color: var(--online-color);
            border-radius: 50%;
            border: 2px solid var(--bg-sidebar);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-top-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .chat-last-msg {
            font-size: 0.85rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bot-tag {
            font-size: 0.65rem;
            background: rgba(42, 171, 238, 0.2);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }

        /* Main Chat Window */
        .chat-area {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        @media (min-width: 768px) {
            .chat-area {
                position: relative;
                transform: none !important;
                z-index: 1;
            }
        }

        /* Mobile Active state */
        .app-container.chat-active .chat-area {
            transform: translateX(0);
        }

        /* Chat Header */
        .chat-header {
            height: 60px;
            background-color: var(--bg-header);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 12px;
            box-shadow: 0 2px 4px var(--shadow-color);
            z-index: 5;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (min-width: 768px) {
            .btn-back { display: none; }
        }

        .header-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #fff;
            flex-shrink: 0;
        }

        .header-info {
            flex: 1;
            min-width: 0;
        }

        .header-name {
            font-size: 1rem;
            font-weight: 500;
        }

        .header-status {
            font-size: 0.75rem;
            color: var(--accent);
        }

        /* Messages Body */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 24px 24px;
            -webkit-overflow-scrolling: touch;
        }

        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 82%;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.in {
            align-self: flex-start;
        }

        .msg-row.out {
            align-self: flex-end;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            user-select: text;
        }

        .msg-row.in .msg-bubble {
            background-color: var(--bg-msg-in);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .msg-row.out .msg-bubble {
            background-color: var(--bg-msg-out);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 0.65rem;
            opacity: 0.7;
            float: right;
            margin-left: 10px;
            margin-top: 4px;
        }

        .msg-media {
            width: 100%;
            max-width: 320px;
            border-radius: 10px;
            margin-top: 6px;
            margin-bottom: 4px;
            display: block;
            object-fit: cover;
        }

        /* Typing Dynamic Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 0.8rem;
            color: var(--text-sub);
            padding: 6px 14px;
            background: var(--bg-msg-in);
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 8px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes blink {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Interactive Action Buttons inside Chat */
        .bot-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .action-btn {
            background: rgba(42, 171, 238, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 18px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:active {
            background: var(--accent);
            color: #fff;
            transform: scale(0.97);
        }

        /* Input Controls Bar */
        .chat-input-area {
            background-color: var(--bg-input);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-color);
        }

        .btn-attach {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.3rem;
            padding: 8px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-attach:active {
            color: var(--accent);
            background: rgba(255,255,255,0.05);
        }

        .msg-input {
            flex: 1;
            background: #242f3d;
            border: none;
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            resize: none;
            max-height: 100px;
            user-select: text;
        }

        .btn-send {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--accent);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .btn-send:active {
            background-color: var(--accent-hover);
            transform: scale(0.95);
        }

        /* Hidden File Input */
        #gallery-upload {
            display: none;
        }

        /* Android Bottom Bar Safe Padding */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .chat-input-area {
                padding-bottom: calc(8px + env(safe-area-inset-bottom));
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* Canvas Preview Modal for Photo Filtering & Memes */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: var(--bg-sidebar);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }

        .modal-title {
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            color: var(--accent);
        }

        .preview-canvas {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .filter-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 140px;
            overflow-y: auto;
        }

        .filter-btn {
            background: #242f3d;
            color: #fff;
            border: 1px solid transparent;
            padding: 8px 4px;
            border-radius: 8px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .filter-btn.active {
            border-color: var(--accent);
            background: var(--bg-msg-out);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-cancel { background: #3a4756; color: #fff; }
        .btn-confirm { background: var(--accent); color: #fff; }

        .btn-download-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #27ae60;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <!-- Sidebar: Chat List -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand-title">
                <i class="fa-solid fa-robot"></i>
                <span>TG BOT PLATFORM</span>
            </div>
            <span class="bot-tag" style="font-size:0.75rem">v3.0 ULTRA</span>
        </div>

        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-bot" class="search-input" placeholder="Поиск ботов...">
            </div>
        </div>

        <div class="chat-list" id="chat-list">
            <!-- Dynamic Chat Items rendered via JS -->
        </div>
    </div>

    <!-- Main Chat Window -->
    <div class="chat-area">
        <div class="chat-header">
            <button class="btn-back" id="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="header-avatar" id="active-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="header-info">
                <div class="header-name" id="active-name">Выберите бота</div>
                <div class="header-status" id="active-status">работает через CDN / API</div>
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <!-- Messages rendered here -->
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <span style="margin-left:4px" id="typing-text">Бот печатает...</span>
        </div>

        <!-- Inputs Area -->
        <div class="chat-input-area">
            <button class="btn-attach" id="btn-attach" title="Прикрепить фото из галереи">
                <i class="fa-solid fa-paperclip"></i>
            </button>
            <input type="file" id="gallery-upload" accept="image/*">
            <input type="text" id="msg-input" class="msg-input" placeholder="Напишите сообщение..." autocomplete="off">
            <button class="btn-send" id="btn-send">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<!-- Modal Dialog for Photo Filter Processing -->
<div class="modal-overlay" id="filter-modal">
    <div class="modal-card">
        <div class="modal-title"><i class="fa-solid fa-wand-magic-sparkles"></i> Обработка Фото Галереи</div>
        <canvas id="modal-canvas" class="preview-canvas"></canvas>
        
        <div style="font-size: 0.8rem; color: var(--text-sub);">Выберите фильтр эффекта:</div>
        <div class="filter-options" id="filter-presets">
            <button class="filter-btn active" data-filter="cyberpunk">Cyberpunk</button>
            <button class="filter-btn" data-filter="vintage">Vintage</button>
            <button class="filter-btn" data-filter="bw">Чёрно-Белый</button>
            <button class="filter-btn" data-filter="sepia">Сепия</button>
            <button class="filter-btn" data-filter="invert">Инверсия</button>
            <button class="filter-btn" data-filter="neon">Неоновый Блик</button>
            <button class="filter-btn" data-filter="warm">Теплый Закат</button>
            <button class="filter-btn" data-filter="cool">Холодный Матрикс</button>
            <button class="filter-btn" data-filter="pixelate">Пиксели</button>
        </div>

        <div class="modal-actions">
            <button class="btn-modal btn-cancel" id="btn-modal-cancel">Отмена</button>
            <button class="btn-modal btn-confirm" id="btn-modal-apply">Отправить в чат</button>
        </div>
    </div>
</div>

            chatListEl.innerHTML = '';

            filtered.forEach(bot => {

        // Escape HTML
        function escapeHtml(str) {
            if(!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

            messagesContainer.innerHTML = '';

            history.forEach(m => {
                const msgRow = document.createElement('div');
                msgRow.className = `msg-row ${m.type}`;

                let contentHtml = formatMarkdown(m.text);

                if (m.mediaUrl) {
                    contentHtml += `<img src="${m.mediaUrl}" class="msg-media" alt="Media" onclick="window.open('${m.mediaUrl}', '_blank')">`;
                }

                if (m.downloadUrl) {
                    contentHtml += `<br><a href="${m.downloadUrl}" download="file.png" class="btn-download-link"><i class="fa-solid fa-download"></i> Скачать файл</a>`;
                }

                if (m.buttons && m.buttons.length > 0) {
                    contentHtml += `<div class="bot-actions">`;
                    m.buttons.forEach(btnText => {
                        contentHtml += `<button class="action-btn" onclick="triggerQuickAction('${escapeHtml(btnText)}')">${escapeHtml(btnText)}</button>`;
                    });
                    contentHtml += `</div>`;
                }

                msgRow.innerHTML = `
                    <div class="msg-bubble">

                        <span class="msg-time">${m.time}</span>
                    </div>
                `;
                messagesContainer.appendChild(msgRow);

        function scrollToBottom() {

        // Simple Markdown Formatter
        function formatMarkdown(text) {
            if (!text) return '';
            let formatted = escapeHtml(text);
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');
            formatted = formatted.replace(/`(.*?)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 4px;border-radius:4px">$1</code>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

            ctx.fillStyle = '#1e272e';
            ctx.fillRect(0, 0, 600, 400);

            // Add simple gradient pattern

            grad.addColorStop(0, '#38ada9');
            grad.addColorStop(1, '#079992');
            ctx.fillStyle = grad;
            ctx.fillRect(20, 20, 560, 360);

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 32px Impact, sans-serif';
            ctx.textAlign = 'center';
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;

            ctx.strokeText(topText.toUpperCase(), 300, 80);
            ctx.fillText(topText.toUpperCase(), 300, 80);

            ctx.strokeText(bottomText.toUpperCase(), 300, 340);
            ctx.fillText(bottomText.toUpperCase(), 300, 340);

            const memeDataUrl = canvas.toDataURL('image/png');
            addMessage('meme_maker', 'in', `🎭 **Ваш Мем сгенерирован!**`, memeDataUrl, ['Когда код заработал | С первого раза'], memeDataUrl);

        // -------------------------------------------------------------

        function openFilterModal(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImgObj = img;
                    applyFilterToCanvas('cyberpunk');

        function applyFilterToCanvas(filterName) {
            if (!originalImgObj) return;
            const canvas = modalCanvas;
            const ctx = canvas.getContext('2d');

            canvas.width = originalImgObj.width;
            canvas.height = originalImgObj.height;

            ctx.drawImage(originalImgObj, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i];
                let g = data[i + 1];
                let b = data[i + 2];

                if (filterName === 'cyberpunk') {
                    data[i] = Math.min(255, r * 1.2 + 40);
                    data[i + 1] = Math.max(0, g * 0.7);
                    data[i + 2] = Math.min(255, b * 1.4 + 50);
                } else if (filterName === 'vintage') {
                    data[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    data[i + 1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    data[i + 2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                } else if (filterName === 'bw') {
                    let avg = (r + g + b) / 3;
                    data[i] = avg; data[i + 1] avg; data[i + 2] = avg;
                } else if (filterName === 'sepia') {
                    data[i] = (r * 0.393) + (g * 0.769) + (b * 0.189);
                    data[i + 1] = (r * 0.349) + (g * 0.686) + (b * 0.168);
                    data[i + 2] = (r * 0.272) + (g * 0.534) + (b * 0.131);
                } else if (filterName === 'invert') {
                    data[i] = 255 - r;
                    data[i + 1] = 255 - g;
                    data[i + 2] = 255 - b;
                } else if (filterName === 'neon') {
                    data[i] = r > 100 ? 255 : r * 0.5;
                    data[i + 1] = g > 100 ? 255 : g * 1.5;
                    data[i + 2] = b > 100 ? 255 : b * 2;
                } else if (filterName === 'warm') {
                    data[i] = Math.min(255, r + 30);
                    data[i + 1] = Math.min(255, g + 10);
                    data[i + 2] = Math.max(0, b - 20);
                } else if (filterName === 'cool') {
                    data[i] = Math.max(0, r - 20);
                    data[i + 1] = Math.min(255, g + 10);
                    data[i + 2] = Math.min(255, b + 40);
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        filterPresets.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                selectedFilter = e.target.getAttribute('data-filter');
                applyFilterToCanvas(selectedFilter);
            }
        });

        btnModalCancel.onclick = () => {
            filterModal.classList.remove('active');
        };

        btnModalApply.onclick = () => {
            const processedDataUrl = modalCanvas.toDataURL('image/png');
            filterModal.classList.remove('active');

            addMessage('photofx', 'out', `📷 Мое фото из галереи для обработки [Фильтр: ${selectedFilter}]`, processedDataUrl);
            
            showTyping('Photo FX Filter Bot');
            setTimeout(() => {
                hideTyping();
                addMessage('photofx', 'in', `✨ **Фото успешно обработано!**\nПрименен эффект: \`${selectedFilter.toUpperCase()}\``, processedDataUrl, ['📷 Загрузить ещё фото'], processedDataUrl);
            }, 800);
        };

        // Render initial bots list
        renderChatList();
        selectBot(BOTS[0].id);
    });
</script>
</body>
</html>
