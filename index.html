<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Telegram Bot Platform Android Ultra</title>
    <meta name="theme-color" content="#17212b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- FontAwesome Font & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0e1621;
            --bg-sidebar: #17212b;
            --bg-chat: #0e1621;
            --bg-header: #17212b;
            --bg-input: #17212b;
            --bg-msg-in: #182533;
            --bg-msg-out: #2b5278;
            --text-main: #f5f5f5;
            --text-sub: #7f91a4;
            --accent: #2aabee;
            --accent-hover: #229ed9;
            --border-color: #101921;
            --online-color: #4cd964;
            --shadow-color: rgba(0,0,0,0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* App Container Mobile First */
        .app-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar View (Chat List) */
        .sidebar-view {
            width: 100%;
            height: 100%;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 10;
            transition: transform 0.22s ease-in-out;
        }

        .app-container.chat-open .sidebar-view {
            transform: translateX(-30%);
            pointer-events: none;
        }

        /* Top Header Navigation */
        .header-bar {
            height: 56px;
            background-color: var(--bg-sidebar);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 16px;
            box-shadow: 0 2px 4px var(--shadow-color);
            z-index: 2;
            flex-shrink: 0;
        }

        .brand-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .android-badge {
            font-size: 0.65rem;
            background: rgba(42, 171, 238, 0.2);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        /* Search Input */
        .search-container {
            padding: 8px 12px;
            background-color: #101921;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background-color: #242f3d;
            border: none;
            border-radius: 20px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
        }

        /* Chat List Scrollable */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .chat-item:active {
            background-color: #202b36;
        }

        .avatar-box {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            color: #ffffff;
            position: relative;
            flex-shrink: 0;
        }

        .online-dot {
            width: 12px;
            height: 12px;
            background-color: var(--online-color);
            border: 2px solid var(--bg-sidebar);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .chat-meta {
            flex: 1;
            min-width: 0;
        }

        .chat-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 0.98rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-time {
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .chat-preview {
            font-size: 0.85rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Window View */
        .chat-view {
            width: 100%;
            height: 100%;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.22s ease-in-out;
        }

        .app-container.chat-open .chat-view {
            transform: translateX(0);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:active {
            opacity: 0.7;
        }

        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 0);
            background-size: 20px 20px;
        }

        .msg-bubble-wrap {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .msg-bubble-wrap.in { align-self: flex-start; }
        .msg-bubble-wrap.out { align-self: flex-end; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
            user-select: text;
            position: relative;
        }

        .msg-bubble-wrap.in .msg-bubble {
            background-color: var(--bg-msg-in);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .msg-bubble-wrap.out .msg-bubble {
            background-color: var(--bg-msg-out);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .msg-time-stamp {
            font-size: 0.65rem;
            opacity: 0.7;
            float: right;
            margin-left: 10px;
            margin-top: 4px;
        }

        .msg-img-media {
            width: 100%;
            max-width: 280px;
            border-radius: 10px;
            margin-top: 6px;
            margin-bottom: 4px;
            display: block;
        }

        .quick-actions-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .quick-btn {
            background: rgba(42, 171, 238, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .quick-btn:active {
            background: var(--accent);
            color: #fff;
        }

        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #27ae60;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
        }

        /* Typing Indicator */
        .typing-bar {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-sub);
            padding: 6px 14px;
            background: var(--bg-msg-in);
            border-radius: 12px;
            width: fit-content;
            margin-left: 12px;
            margin-bottom: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.2s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* Bottom Controls */
        .input-bar {
            background-color: var(--bg-input);
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .input-field {
            flex: 1;
            background: #242f3d;
            border: none;
            border-radius: 20px;
            padding: 10px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            user-select: text;
        }

        .btn-send-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: var(--accent);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-send-circle:active {
            transform: scale(0.95);
        }

        /* Gallery Modal Editor */
        .modal-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-screen.open {
            display: flex;
        }

        .modal-box {
            background: var(--bg-sidebar);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }

        .modal-head {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--accent);
            text-align: center;
        }

        .canvas-preview {
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .f-btn {
            background: #242f3d;
            color: #fff;
            border: 1px solid transparent;
            padding: 8px 2px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .f-btn.active {
            border-color: var(--accent);
            background: var(--bg-msg-out);
        }

        .modal-btns {
            display: flex;
            gap: 10px;
        }

        .m-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .m-btn-cancel { background: #3a4756; color: #fff; }
        .m-btn-apply { background: var(--accent); color: #fff; }

        #file-input-gallery { display: none; }
    </style>
</head>
<body>

<div class="app-container" id="app">

    <!-- 1. SIDEBAR LIST VIEW -->
    <div class="sidebar-view">
        <div class="header-bar">
            <i class="fa-solid fa-robot" style="font-size:1.4rem; color:var(--accent)"></i>
            <div class="brand-title">
                <span>TG BOTS ANDROID</span>
            </div>
            <span class="android-badge">12 БОТОВ</span>
        </div>

        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Поиск ботов...">
            </div>
        </div>

        <div class="chat-list" id="chat-list">
            <!-- Dynamic items injected by JS -->
        </div>
    </div>

    <!-- 2. ACTIVE CHAT VIEW -->
    <div class="chat-view">
        <div class="header-bar">
            <button class="btn-icon" id="btn-back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="avatar-box" id="active-avatar" style="width:40px; height:40px; font-size:1.1rem;">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div style="flex:1; min-width:0;">
                <div id="active-title" style="font-size:0.98rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Выберите бота</div>
                <div id="active-status" style="font-size:0.75rem; color:var(--accent);">онлайн</div>
            </div>
        </div>

        <div class="messages-area" id="messages-area">
            <!-- Messages injected here -->
        </div>

        <div class="typing-bar" id="typing-bar">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <span id="typing-name" style="margin-left:4px">Бот печатает...</span>
        </div>

        <div class="input-bar">
            <button class="btn-icon" id="btn-attach" title="Выбрать из галереи">
                <i class="fa-solid fa-paperclip" style="color:var(--text-sub)"></i>
            </button>
            <input type="file" id="file-input-gallery" accept="image/*">
            <input type="text" id="msg-input" class="input-field" placeholder="Сообщение..." autocomplete="off">
            <button class="btn-send-circle" id="btn-send">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

</div>

<!-- 3. PHOTO FX MODAL (ANDROID GALLERY CANVAS) -->
<div class="modal-screen" id="modal-screen">
    <div class="modal-box">
        <div class="modal-head"><i class="fa-solid fa-wand-magic-sparkles"></i> Фильтр для фотоиз Галереи</div>
        <canvas id="editor-canvas" class="canvas-preview"></canvas>
        
        <div style="font-size:0.8rem; color:var(--text-sub)">Выберите эффект обработчика:</div>
        <div class="filter-grid" id="filter-buttons">
            <button class="f-btn active" data-f="cyber">Cyberpunk</button>
            <button class="f-btn" data-f="vintage">Vintage</button>
            <button class="f-btn" data-f="bw">Чёрно-Белый</button>
            <button class="f-btn" data-f="sepia">Сепия</button>
            <button class="f-btn" data-f="invert">Инверсия</button>
            <button class="f-btn" data-f="neon">Неон</button>
            <button class="f-btn" data-f="warm">Теплый</button>
            <button class="f-btn" data-f="cool">Холодный</button>
            <button class="f-btn" data-f="contrast">Контраст</button>
        </div>

        <div class="modal-btns">
            <button class="m-btn m-btn-cancel" id="btn-modal-cancel">Отмена</button>
            <button class="m-btn m-btn-apply" id="btn-modal-apply">Отправить в чат</button>
        </div>
    </div>
</div>

        const app = document.getElementById('app');
        const chatListEl = document.getElementById('chat-list');
        const searchInput = document.getElementById('search-input');
        const btnBack = document.getElementById('btn-back');
        const activeAvatar = document.getElementById('active-avatar');
        const activeTitle = document.getElementById('active-title');
        const activeStatus = document.getElementById('active-status');
        const messagesArea = document.getElementById('messages-area');
        const msgInput = document.getElementById('msg-input');
        const btnSend = document.getElementById('btn-send');
        const btnAttach = document.getElementById('btn-attach');
        const fileInputGallery = document.getElementById('file-input-gallery');
        const typingBar = document.getElementById('typing-bar');
        const typingName = document.getElementById('typing-name');

        // Modal Editor elements
        const modalScreen = document.getElementById('modal-screen');
        const editorCanvas = document.getElementById('editor-canvas');
        const filterButtons = document.getElementById('filter-buttons');
        const btnModalCancel = document.getElementById('btn-modal-cancel');
        const btnModalApply = document.getElementById('btn-modal-apply');

        let selectedFilter = 'cyber';
        let currentLoadedImg = null;

        // Current time helper
        function getNowTime() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        // Render Chat List
        function renderChatList(filterTerm = '') {
            chatListEl.innerHTML = '';
            const filtered = BOTS.filter(b => 
                b.name.toLowerCase().includes(filterTerm.toLowerCase()) || 
                b.desc.toLowerCase().includes(filterTerm.toLowerCase())
            );

            filtered.forEach(bot => {
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.onclick = () => openBotChat(bot.id);

                const botHistory = histories[bot.id];
                const lastMsg = botHistory.length > 0 ? botHistory[botHistory.length - 1].text : bot.lastMsg;
                const lastTime = botHistory.length > 0 ? botHistory[botHistory.length - 1].time : '12:00';

                item.innerHTML = `
                    <div class="avatar-box" style="background: ${bot.avatarBg}">
                        <i class="${bot.icon}"></i>
                        <div class="online-dot"></div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-row-top">
                            <div class="chat-name">${bot.name}</div>
                            <div class="chat-time">${lastTime}</div>
                        </div>
                        <div class="chat-preview">${escapeStr(lastMsg)}</div>
                    </div>
                `;
                chatListEl.appendChild(item);
            });
        }

        function escapeStr(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Open Selected Bot Chat
        function openBotChat(botId) {
            activeBotId = botId;
            const bot = BOTS.find(b => b.id === botId);

            activeAvatar.style.background = bot.avatarBg;
            activeAvatar.innerHTML = `<i class="${bot.icon}"></i>`;
            activeTitle.innerText = bot.name;
            activeStatus.innerText = bot.status;

            app.classList.add('chat-open');

            if (histories[botId].length === 0) {
                pushMsg(botId, 'in', `👋 Привет! Я **${bot.name}**.\n${bot.desc}`, null, bot.btns || bot.quickBtns);
            } else {
                renderMessages();
            }
        }

        btnBack.onclick = () => {
            app.classList.remove('chat-open');
        };

        // Render Messages in active chat
        function renderMessages() {
            messagesArea.innerHTML = '';
            const list = histories[activeBotId] || [];

            list.forEach(m => {
                const wrap = document.createElement('div');
                wrap.className = `msg-bubble-wrap ${m.type}`;

                let html = formatMarkdown(m.text);

                if (m.imgUrl) {
                    html += `<img src="${m.imgUrl}" class="msg-img-media" onclick="window.open('${m.imgUrl}', '_blank')">`;
                }

                if (m.dlUrl) {
                    html += `<br><a href="${m.dlUrl}" download="photo.png" class="dl-btn"><i class="fa-solid fa-download"></i> Скачать файл</a>`;
                }

                if (m.buttons && m.buttons.length > 0) {
                    html += `<div class="quick-actions-bar">`;
                    m.buttons.forEach(btnText => {
                        html += `<button class="quick-btn" onclick="clickQuickBtn('${escapeStr(btnText)}')">${escapeStr(btnText)}</button>`;
                    });
                    html += `</div>`;
                }

                wrap.innerHTML = `
                    <div class="msg-bubble">
                        ${html}
                        <span class="msg-time-stamp">${m.time}</span>
                    </div>
                `;
                messagesArea.appendChild(wrap);
            });

            scrollToBottom();
        }

        function scrollToBottom() {
            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 60);
        }

        function formatMarkdown(txt) {
            if (!txt) return '';
            let s = escapeStr(txt);
            s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/`(.*?)`/g, '<code style="background:rgba(0,0,0,0.3);padding:2px 4px;border-radius:4px">$1</code>');
            s = s.replace(/\n/g, '<br>');
            return s;
        }

        function pushMsg(botId, type, text, imgUrl = null, buttons = null, dlUrl = null) {
            const time = getNowTime();
            histories[botId].push({ type, text, imgUrl, buttons, dlUrl, time });
            if (botId === activeBotId) {
                renderMessages();
            }
            renderChatList(searchInput.value);
        }

        window.clickQuickBtn = function(txt) {
            msgInput.value = txt;
            onSendMessage();
        };

        function showTypingAnim(name = 'Бот') {
            typingName.innerText = `${name} печатает...`;
            typingBar.style.display = 'flex';
            scrollToBottom();
        }

        function hideTypingAnim() {
            typingBar.style.display = 'none';
        }

        // Send message handler
        function onSendMessage() {
            const val = msgInput.value.trim();
            if (!val) return;

            msgInput.value = '';
            pushMsg(activeBotId, 'out', val);

            const botObj = BOTS.find(b => b.id === activeBotId);
            showTypingAnim(botObj.name);

            setTimeout(() => {
                dispatchBotReply(activeBotId, val);
            }, 600);
        }

        btnSend.onclick = onSendMessage;
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') onSendMessage();
        });

        // Attachment Gallery Upload Handler
        btnAttach.onclick = () => {
            fileInputGallery.click();
        };

        fileInputGallery.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (activeBotId === 'photofx') {
                openFilterCanvasModal(file);
            } else {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    pushMsg(activeBotId, 'out', '📷 Отправлено фотоиз галереи Android', evt.target.result);
                    showTypingAnim();
                    setTimeout(() => {
                        hideTypingAnim();
                        pushMsg(activeBotId, 'in', 'Фото получено! Чтобы применить фильтры и эффекты, перейдите в чат с **Photo FX Filter Bot**.');
                    }, 800);
                };
                reader.readAsDataURL(file);
            }
            fileInputGallery.value = '';
        };

        searchInput.oninput = (e) => {
            renderChatList(e.target.value);
        };

        // -------------------------------------------------------------
        // BOT DISPATCHER & LOGIC
        // -------------------------------------------------------------
        async function dispatchBotReply(botId, text) {
            switch (botId) {
                case 'pinterest':
                    hideTypingAnim();
                    let query = text.replace('📌', '').replace('🔍', '').trim();
                    if (!query) query = 'aesthetic neon wallpaper';
                    const rand = Math.floor(Math.random() * 9999);
                    const pinterestImg = `https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80&sig=${rand}`;
                    pushMsg('pinterest', 'in', `📌 **Pinterest Saver HD**\n\nРезультат по запросу: "${query}"\nНажмите для скачивания:`, pinterestImg, ['📌 Скачать ещё', '🔍 Поиск "Cyberpunk"'], pinterestImg);
                    break;

                case 'photofx':
                    hideTypingAnim();
                    pushMsg('photofx', 'in', 'Нажмите на скрепку 📎 слева внизу, выберите фото из вашей ГАЛЕРИИ Android и откроется редактор эффектов!');
                    break;

                case 'ai_chat':
                    try {
                        const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(text)}`);
                        if (res.ok) {
                            const aiTxt = await res.text();
                            hideTypingAnim();
                            pushMsg('ai_chat', 'in', aiTxt);
                            return;
                        }
                    } catch (e) {}
                    hideTypingAnim();
                    pushMsg('ai_chat', 'in', `🤖 **Cyber AI:** Я принял ваш запрос "${text}". Работаю стабильно на смартфонах Android без ключей API!`);
                    break;

                case 'art_gen':
                    hideTypingAnim();
                    const prompt = encodeURIComponent(text);
                    const artUrl = `https://image.pollinations.ai/prompt/${prompt}?width=800&height=800&nologo=true&seed=${Math.floor(Math.random()*10000)}`;
                    pushMsg('art_gen', 'in', `🎨 **Сгенерировано изображение AI:**\n"${text}"`, artUrl, ['🎨 Неоновый город', '🐱 Кот космонавт'], artUrl);
                    break;

                case 'weather':
                    try {
                        const cleanCity = text.replace('🏙', '').replace('🌆', '').trim();
                        const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cleanCity)}&count=1&language=ru`).then(r=>r.json());
                        if (geo.results && geo.results[0]) {
                            const { latitude, longitude, name, country } = geo.results[0];
                            const w = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`).then(r=>r.json());
                            hideTypingAnim();
                            pushMsg('weather', 'in', `🌤 **Погода в ${name}, ${country}:**\n\n🌡 Температура: **${w.current_weather.temperature}°C**\n💨 Ветер: ${w.current_weather.windspeed} км/ч`, null, ['🏙 Москва', '🌆 Санкт-Петербург']);
                            return;
                        }
                    } catch(e) {}
                    hideTypingAnim();
                    pushMsg('weather', 'in', `🌤 **Погода в городе ${text}:**\n\n🌡 Температура: **+21°C**\n☀️ Солнечно, легкий ветер.`, null, ['🏙 Москва']);
                    break;

                case 'crypto':
                    try {
                        const c = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,toncoin,solana&vs_currencies=usd&include_24hr_change=true').then(r=>r.json());
                        hideTypingAnim();
                        let t = `🪙 **Курсы Криптовалют (Live):**\n\n`;
                        t += `₿ **Bitcoin:** $${c.bitcoin?.usd || '67000'} (${c.bitcoin?.usd_24h_change?.toFixed(1)}%)\n`;
                        t += `Ξ **Ethereum:** $${c.ethereum?.usd || '3500'} (${c.ethereum?.usd_24h_change?.toFixed(1)}%)\n`;
                        t += `💎 **TON Coin:** $${c.toncoin?.usd || '6.8'} (${c.toncoin?.usd_24h_change?.toFixed(1)}%)\n`;
                        t += `◎ **Solana:** $${c.solana?.usd || '145'} (${c.solana?.usd_24h_change?.toFixed(1)}%)`;
                        pushMsg('crypto', 'in', t, null, ['🪙 Обновить курс', '💎 TON Coin Price']);
                        return;
                    } catch(e) {}
                    hideTypingAnim();
                    pushMsg('crypto', 'in', `🪙 **Курс Криптовалют:**\n\n₿ **BTC:** $67,500 (+2.1%)\n💎 **TON:** $6.90 (+4.8%)`);
                    break;

                case 'qr_gen':
                    hideTypingAnim();
                    const qr = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(text)}`;
                    pushMsg('qr_gen', 'in', `📱 **Ваш QR-код сгенерирован:**\n\`${text}\``, qr, null, qr);
                    break;

                case 'voice_synth':
                    hideTypingAnim();
                    if ('speechSynthesis' in window) {
                        const u = new SpeechSynthesisUtterance(text);
                        u.lang = 'ru-RU';
                        window.speechSynthesis.speak(u);
                        pushMsg('voice_synth', 'in', `🔊 **Озвучено:**\n"${text}"\n*(Запущено воспроизведение в динамике Android)*`);
                    } else {
                        pushMsg('voice_synth', 'in', 'Озвучка не поддерживается вашим браузером.');
                    }
                    break;

                case 'translator':
                    try {
                        const tr = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ru|en`).then(r=>r.json());
                        hideTypingAnim();
                        pushMsg('translator', 'in', `🌐 **Перевод (RU ➔ EN):**\n\n${tr.responseData.translatedText}`);
                        return;
                    } catch(e) {}
                    hideTypingAnim();
                    pushMsg('translator', 'in', `🌐 **Перевод:**\n\n${text} ➔ Translated into English.`);
                    break;

                case 'meme_maker':
                    hideTypingAnim();
                    const parts = text.split('|');
                    const topT = (parts[0] || 'ВЕРХНИЙ ТЕКСТ').trim();
                    const botT = (parts[1] || 'НИЖНИЙ ТЕКСТ').trim();

                    const cvs = document.createElement('canvas');
                    cvs.width = 500; cvs.height = 350;
                    const ctx = cvs.getContext('2d');
                    ctx.fillStyle = '#2b5278'; ctx.fillRect(0,0,500,350);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '900 28px Impact, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 3;

                    ctx.strokeText(topT.toUpperCase(), 250, 60);
                    ctx.fillText(topT.toUpperCase(), 250, 60);

                    ctx.strokeText(botT.toUpperCase(), 250, 300);
                    ctx.fillText(botT.toUpperCase(), 250, 300);

                    const memeUrl = cvs.toDataURL('image/png');
                    pushMsg('meme_maker', 'in', `🎭 **Ваш мем готов!**`, memeUrl, ['Когда код заработал | С первого раза'], memeUrl);
                    break;

                case 'text_analyst':
                    hideTypingAnim();
                    pushMsg('text_analyst', 'in', `📊 **Анализ Текста:**\n\n🔤 Длина: **${text.length} символов**\n📝 Слов: **${text.trim().split(/\s+/).length}**\n🔠 Регистр: \`${text.toLowerCase()}\``);
                    break;

                case 'arcade_game':
                    hideTypingAnim();
                    if (text.includes('Слоты') || text.includes('🎰')) {
                        const items = ['🍎', '🍋', '🍒', '7️⃣', '💎'];
                        const a = items[Math.floor(Math.random()*items.length)];
                        const b = items[Math.floor(Math.random()*items.length)];
                        const c = items[Math.floor(Math.random()*items.length)];
                        const win = (a === b && b === c) ? '🎉 **ВЫИГРАШ! JackPot!** 🎉' : 'Попробуйте ещё раз!';
                        pushMsg('arcade_game', 'in', `🎰 **Игровой Автомат:**\n\n[ ${a} | ${b} | ${c} ]\n\n${win}`, null, ['🎰 Игровой автомат Слоты', '🎲 Бросить кость']);
                    } else if (text.includes('Кость') || text.includes('🎲')) {
                        const num = Math.floor(Math.random()*6) + 1;
                        pushMsg('arcade_game', 'in', `🎲 Выпало костью: **${num}**!`, null, ['🎲 Бросить кость', '✂️ Камень Ножницы Бумага']);
                    } else {
                        const opts = ['Камень 🪨', 'Ножницы ✂️', 'Бумага 📄'];
                        const botAns = opts[Math.floor(Math.random()*opts.length)];
                        pushMsg('arcade_game', 'in', `✂️ Выбор бота: **${botAns}**!`, null, ['🎰 Игровой автомат Слоты']);
                    }
                    break;

                default:
                    hideTypingAnim();
                    pushMsg(botId, 'in', 'Принято!');
            }
        }

        // -------------------------------------------------------------
        // PHOTO FILTER CANVAS MODAL (Photo FX)
        // -------------------------------------------------------------
        function openFilterCanvasModal(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentLoadedImg = img;
                    renderCanvasWithFilter('cyber');
                    modalScreen.classList.add('open');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCanvasWithFilter(filterType) {
            if (!currentLoadedImg) return;
            const ctx = editorCanvas.getContext('2d');
            editorCanvas.width = currentLoadedImg.width;
            editorCanvas.height = currentLoadedImg.height;

            ctx.drawImage(currentLoadedImg, 0, 0);

            const imgData = ctx.getImageData(0, 0, editorCanvas.width, editorCanvas.height);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];

                if (filterType === 'cyber') {
                    d[i] = Math.min(255, r * 1.3 + 30);
                    d[i+1] = Math.max(0, g * 0.6);
                    d[i+2] = Math.min(255, b * 1.5 + 40);
                } else if (filterType === 'vintage') {
                    d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                } else if (filterType === 'bw') {
                    let avg = (r + g + b) / 3;
                    d[i] = avg; d[i+1] = avg; d[i+2] = avg;
                } else if (filterType === 'sepia') {
                    d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                } else if (filterType === 'invert') {
                    d[i] = 255 - r; d[i+1] = 255 - g; d[i+2] = 255 - b;
                } else if (filterType === 'neon') {
                    d[i] = r > 100 ? 255 : r * 0.5;
                    d[i+1] = g > 100 ? 255 : g * 1.4;
                    d[i+2] = b > 100 ? 255 : b * 2;
                } else if (filterType === 'warm') {
                    d[i] = Math.min(255, r + 40);
                    d[i+1] = Math.min(255, g + 15);
                    d[i+2] = Math.max(0, b - 20);
                } else if (filterType === 'cool') {
                    d[i] = Math.max(0, r - 20);
                    d[i+1] = Math.min(255, g + 10);
                    d[i+2] = Math.min(255, b + 50);
                } else if (filterType === 'contrast') {
                    d[i] = r > 128 ? Math.min(255, r * 1.2) : Math.max(0, r * 0.8);
                    d[i+1] = g > 128 ? Math.min(255, g * 1.2) : Math.max(0, g * 0.8);
                    d[i+2] = b > 128 ? Math.min(255, b * 1.2) : Math.max(0, b * 0.8);
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        filterButtons.onclick = (e) => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('.f-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                selectedFilter = e.target.getAttribute('data-f');
                renderCanvasWithFilter(selectedFilter);
            }
        };

        btnModalCancel.onclick = () => {
            modalScreen.classList.remove('open');
        };

        btnModalApply.onclick = () => {
            const outUrl = editorCanvas.toDataURL('image/png');
            modalScreen.classList.remove('open');

            pushMsg('photofx', 'out', `📷 Отправлено фотоиз галереи для обработки [Эффект: ${selectedFilter}]`, outUrl);

            showTypingAnim('Photo FX Filter Bot');
            setTimeout(() => {
                hideTypingAnim();
                pushMsg('photofx', 'in', `✨ **Фото из галереи успешно обработано!**\nПрименен фильтр: \`${selectedFilter.toUpperCase()}\``, outUrl, ['📷 Выбрать еще фото из галереи'], outUrl);
            }, 800);
        };

        // Render initial bots list
        renderChatList();
    });
</script>
</body>
</html>
