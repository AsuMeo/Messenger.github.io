<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDIT GOD PRO - Видеоредактор для Android</title>
    <!-- Tailwind CSS, Lucide Icons, Canvas Confetti, GSAP -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,900&family=Orbitron:wght@700;900&family=Russo+One&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #030305;
            color: #f4f4f5;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .font-impact { font-family: 'Russo One', sans-serif; }

        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }

        /* Timeline & Touch Controls */
        .timeline-scroll-container {
            touch-action: pan-x pan-y;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .timeline-ruler {
            background: linear-gradient(180deg, #121217 0%, #09090b 100%);
            touch-action: none;
        }

        .timeline-track {
            background: #0d0d12;
            border-bottom: 1px solid #1f1f28;
            touch-action: pan-x;
        }

        .timeline-clip {
            transition: border-color 0.15s, transform 0.1s;
            cursor: pointer;
            touch-action: manipulation;
        }

        .timeline-clip.selected {
            border-color: #a855f7 !important;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
        }

        /* Touch Playhead Knob */
        .playhead-knob {
            touch-action: none;
            cursor: grab;
        }
        .playhead-knob:active {
            cursor: grabbing;
        }

        /* Video Frame Box */
        .video-stage-frame {
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9), 0 0 0 2px rgba(168, 85, 247, 0.3);
            border-radius: 20px;
        }

        /* Custom Slider Range */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.9);
        }
    </style>
</head>
<body class="bg-[#030305] flex flex-col h-screen w-screen overflow-hidden select-none">

    <!-- TOP MOBILE HEADER -->
    <header class="h-12 bg-[#09090b] border-b border-zinc-800/80 px-3 flex items-center justify-between shrink-0 z-40">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 bg-purple-950/80 border border-purple-500/50 rounded-xl flex items-center justify-center shadow-lg shrink-0">
                <i data-lucide="video" class="w-4 h-4 text-purple-400"></i>
            </div>
            <div class="truncate">
                <h1 class="font-cyber text-xs font-black tracking-wider text-white flex items-center space-x-1">
                    <span>EDIT GOD</span>
                    <span class="text-[8px] bg-purple-600/30 border border-purple-500/50 text-purple-300 font-mono px-1 py-0.2 rounded">PRO</span>
                </h1>
            </div>
        </div>

        <div class="flex items-center space-x-1.5">
            <!-- Aspect Ratio Selector -->
            <select id="aspectRatioSelect" onchange="changeAspectRatio(this.value)" class="bg-zinc-900 border border-zinc-800 text-zinc-300 text-[10px] font-mono font-bold rounded-lg px-2 py-1 focus:outline-none">
                <option value="9:16">9:16 (TikTok)</option>
                <option value="16:9">16:9 (YouTube)</option>
                <option value="1:1">1:1 (Квадрат)</option>
            </select>

            <button onclick="clearProjectData()" title="Очистить проект" class="bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-red-400 p-1.5 rounded-lg active:scale-90 transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>

            <button onclick="openExportModal()" class="bg-purple-600 hover:bg-purple-500 text-white font-cyber text-[10px] font-bold px-3 py-1.5 rounded-lg border border-purple-400 shadow-lg flex items-center space-x-1 active:scale-95 transition">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>ЭКСПОРТ</span>
            </button>
        </div>
    </header>

    <!-- MAIN PREVIEW & CANVAS AREA -->
    <main class="flex-1 bg-[#050507] p-2 flex flex-col items-center justify-between relative overflow-hidden">
        
        <!-- Timecode & Aspect Indicator -->
        <div class="w-full max-w-md flex items-center justify-between text-xs font-mono text-zinc-400 px-1 py-0.5">
            <div class="flex items-center space-x-1.5">
                <span id="timecodeDisplay" class="text-purple-400 font-bold text-xs bg-zinc-900 border border-zinc-800 px-2 py-0.5 rounded-md">00:00.0</span>
                <span class="text-[10px] text-zinc-600">/</span>
                <span id="totalTimeDisplay" class="text-zinc-500 text-[11px]">00:10.0</span>
            </div>
            <button onclick="openFullscreenModal()" class="p-1 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-lg text-zinc-300 active:scale-90 transition flex items-center space-x-1 text-[10px] px-2">
                <i data-lucide="maximize-2" class="w-3 h-3 text-purple-400"></i>
                <span>Полный экран</span>
            </button>
        </div>

        <!-- Preview Canvas Container -->
        <div id="canvasViewport" class="relative flex-1 flex items-center justify-center w-full my-1 overflow-hidden">
            <div id="stageContainer" class="relative bg-black rounded-[20px] overflow-hidden video-stage-frame flex items-center justify-center transition-all duration-300 aspect-[9/16] max-h-[340px] w-auto">
                <canvas id="previewCanvas" class="w-full h-full object-contain pointer-events-none"></canvas>
                <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-75 z-20"></div>

                <div id="emptyCanvasNotice" class="absolute inset-0 flex flex-col items-center justify-center text-center p-4 pointer-events-none z-10">
                    <i data-lucide="clapperboard" class="w-8 h-8 text-zinc-700 mb-1"></i>
                    <p class="text-[11px] font-medium text-zinc-500">Нажмите "+ ФАЙЛ" внизу для создания эдита</p>
                </div>
            </div>
        </div>

        <!-- Quick Mobile Transport Controls -->
        <div class="w-full max-w-md flex items-center justify-between bg-zinc-950 border border-zinc-800/80 rounded-xl p-1.5 px-2 shadow-xl space-x-1.5">
            <button onclick="splitActiveClip()" class="flex-1 py-2 bg-zinc-900 active:bg-zinc-800 border border-zinc-800 rounded-lg text-zinc-200 active:scale-95 transition flex items-center justify-center space-x-1 text-xs font-bold">
                <i data-lucide="scissors" class="w-3.5 h-3.5 text-purple-400"></i>
                <span>Разрезать</span>
            </button>
            
            <button onclick="togglePlay()" id="masterPlayBtn" class="flex-1 py-2 bg-purple-600 hover:bg-purple-500 border border-purple-400 text-white rounded-lg font-cyber text-xs font-bold flex items-center justify-center space-x-1.5 active:scale-95 transition shadow-lg">
                <i data-lucide="play" class="w-3.5 h-3.5 fill-current" id="masterPlayIcon"></i>
                <span id="masterPlayText">ИГРАТЬ</span>
            </button>

            <button onclick="deleteActiveClip()" class="flex-1 py-2 bg-zinc-900 active:bg-zinc-800 border border-zinc-800 rounded-lg text-red-400 active:scale-95 transition flex items-center justify-center space-x-1 text-xs font-bold">
                <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                <span>Удалить</span>
            </button>
        </div>

    </main>

    <!-- MOBILE TOOLBAR & INSPECTOR DRAWER -->
    <div class="bg-[#09090b] border-t border-zinc-800 flex flex-col shrink-0 z-30">
        
        <!-- Inspector Tab Headers (Large Touch Targets) -->
        <div class="flex items-center border-b border-zinc-800/80 bg-zinc-950 text-xs font-bold text-zinc-400 justify-around">
            <button onclick="switchInspectorTab('media')" id="tabBtnMedia" class="inspector-tab flex-1 py-2.5 flex items-center justify-center space-x-1 border-b-2 border-purple-500 text-purple-400">
                <i data-lucide="folder-plus" class="w-4 h-4"></i>
                <span>Медиа</span>
            </button>
            <button onclick="switchInspectorTab('fx')" id="tabBtnFx" class="inspector-tab flex-1 py-2.5 flex items-center justify-center space-x-1 border-b-2 border-transparent hover:text-zinc-200">
                <i data-lucide="wand2" class="w-4 h-4 text-pink-400"></i>
                <span>Эффекты</span>
            </button>
            <button onclick="switchInspectorTab('text')" id="tabBtnText" class="inspector-tab flex-1 py-2.5 flex items-center justify-center space-x-1 border-b-2 border-transparent hover:text-zinc-200">
                <i data-lucide="type" class="w-4 h-4 text-cyan-400"></i>
                <span>Текст</span>
            </button>
            <button onclick="switchInspectorTab('anim')" id="tabBtnAnim" class="inspector-tab flex-1 py-2.5 flex items-center justify-center space-x-1 border-b-2 border-transparent hover:text-zinc-200">
                <i data-lucide="sliders" class="w-4 h-4 text-amber-400"></i>
                <span>Анимация</span>
            </button>
        </div>

        <!-- Inspector Drawer Body (Collapsible or Scrollable) -->
        <div id="inspectorDrawer" class="max-h-36 overflow-y-auto p-2 space-y-2 text-xs">
            
            <!-- MEDIA TAB -->
            <div id="tabContentMedia" class="space-y-2">
                <div class="grid grid-cols-2 gap-2">
                    <label class="border border-dashed border-purple-500/60 bg-purple-950/20 active:bg-purple-900/40 rounded-xl p-2.5 text-center cursor-pointer transition active:scale-95 flex items-center justify-center space-x-2">
                        <input type="file" id="mediaInput" accept="image/*,video/*,audio/*" multiple class="hidden" onchange="handleImportMedia(event)">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-purple-400"></i>
                        <span class="font-bold text-white text-xs">+ ФАЙЛ С ТЕЛЕФОНА</span>
                    </label>

                    <button onclick="addPresetAudio('Phonk Drift', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-left active:border-cyan-500 flex items-center justify-between">
                        <div>
                            <p class="font-bold text-cyan-400 text-xs">Phonk Drift MP3</p>
                            <p class="text-[9px] text-zinc-500">Готовый бит</p>
                        </div>
                        <i data-lucide="music" class="w-4 h-4 text-cyan-400"></i>
                    </button>
                </div>
            </div>

            <!-- FX TAB -->
            <div id="tabContentFx" class="space-y-2 hidden">
                <div class="grid grid-cols-4 gap-1.5">
                    <button onclick="applyEffectToSelected('phonkShake')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-center active:scale-95">
                        <span class="font-bold text-purple-400 block text-[11px]">Phonk Shake</span>
                    </button>
                    <button onclick="applyEffectToSelected('glitchCyber')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-center active:scale-95">
                        <span class="font-bold text-cyan-400 block text-[11px]">Glitch Cyber</span>
                    </button>
                    <button onclick="applyEffectToSelected('zoomBounce')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-center active:scale-95">
                        <span class="font-bold text-pink-400 block text-[11px]">Zoom Beat</span>
                    </button>
                    <button onclick="applyEffectToSelected('flashBeat')" class="bg-zinc-900 border border-zinc-800 p-2 rounded-xl text-center active:scale-95">
                        <span class="font-bold text-amber-400 block text-[11px]">Flash Beat</span>
                    </button>
                </div>

                <div class="flex items-center space-x-2">
                    <span class="text-[10px] font-bold text-zinc-400 shrink-0">Цвет / LUT:</span>
                    <select id="filterSelect" onchange="applyFilterToSelected(this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-1.5 text-xs text-white">
                        <option value="none">Без фильтра</option>
                        <option value="contrast(1.8) saturate(1.8)">Cyber Phonk (Контраст)</option>
                        <option value="hue-rotate(180deg) contrast(1.5)">Neon Blue</option>
                        <option value="sepia(1) hue-rotate(300deg) saturate(2)">Pink Glow</option>
                        <option value="grayscale(1) contrast(2)">Noir Dark</option>
                        <option value="invert(1) contrast(2)">Negative God</option>
                    </select>
                </div>
            </div>

            <!-- TEXT TAB -->
            <div id="tabContentText" class="space-y-2 hidden">
                <div class="flex items-center space-x-2">
                    <button onclick="addNewTextLayer()" class="py-2 px-3 bg-cyan-600 active:bg-cyan-500 text-white font-cyber font-bold rounded-lg text-xs flex items-center space-x-1 shrink-0">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>+ ТЕКСТ</span>
                    </button>
                    <input type="text" id="textLayerInput" placeholder="Введите текст..." oninput="updateActiveTextLayer()" class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-xs text-white font-impact focus:outline-none focus:border-cyan-500">
                </div>
            </div>

            <!-- ANIMATION TAB -->
            <div id="tabContentAnim" class="space-y-2 hidden">
                <div class="grid grid-cols-3 gap-2 text-[10px]">
                    <div>
                        <div class="flex justify-between text-zinc-400 mb-0.5">
                            <span>Размер:</span>
                            <span id="scaleValText" class="text-amber-400 font-mono">100%</span>
                        </div>
                        <input type="range" id="scaleSlider" min="50" max="300" value="100" oninput="updateClipTransform()" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-zinc-400 mb-0.5">
                            <span>Поворот:</span>
                            <span id="rotateValText" class="text-amber-400 font-mono">0°</span>
                        </div>
                        <input type="range" id="rotateSlider" min="-180" max="180" value="0" oninput="updateClipTransform()" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-zinc-400 mb-0.5">
                            <span>Прозрачн:</span>
                            <span id="opacityValText" class="text-amber-400 font-mono">100%</span>
                        </div>
                        <input type="range" id="opacitySlider" min="0" max="100" value="100" oninput="updateClipTransform()" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- TOUCH TIMELINE AREA WITH DRAGGABLE RED SCRUBBER -->
    <div class="h-44 bg-[#070709] border-t border-zinc-800 flex flex-col shrink-0 relative select-none">
        
        <!-- Timeline Touch Ruler & Scrubber Area -->
        <div id="timelineScrollArea" class="timeline-scroll-container flex-1 relative overflow-x-auto overflow-y-hidden p-1 space-y-1.5">
            
            <!-- TIME RULER STRIP WITH TOUCH DRAG SUPPORT -->
            <div id="timelineRuler" class="timeline-ruler h-6 rounded-md w-[2000px] relative flex items-center px-3 border-b border-zinc-800/80 cursor-pointer">
                <!-- Dynamic Ruler Ticks Generated by JS -->
            </div>

            <!-- RED DRAGGABLE PLAYHEAD KNOB & SCRUBBER LINE -->
            <div id="playheadGroup" class="absolute top-0 bottom-0 z-40 flex flex-col items-center pointer-events-none transition-none" style="left: 12px;">
                <!-- Easy Touch Scrubber Head Handle -->
                <div id="playheadKnob" class="playhead-knob w-6 h-6 bg-red-500 rounded-full border-2 border-white shadow-xl flex items-center justify-center -translate-y-1 pointer-events-auto">
                    <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
                </div>
                <!-- Vertical Line -->
                <div class="w-0.5 flex-1 bg-red-500 shadow-lg"></div>
            </div>

            <!-- TRACK 1: VIDEO & PHOTO CLIPS -->
            <div class="timeline-track h-10 rounded-lg relative flex items-center px-1 w-[2000px]" id="videoTrackContainer">
                <div class="absolute left-2 text-[8px] font-cyber text-purple-400 font-bold opacity-30 pointer-events-none">VIDEO / PHOTO TRACK</div>
            </div>

            <!-- TRACK 2: TEXT & OVERLAYS -->
            <div class="timeline-track h-8 rounded-lg relative flex items-center px-1 w-[2000px]" id="textTrackContainer">
                <div class="absolute left-2 text-[8px] font-cyber text-cyan-400 font-bold opacity-30 pointer-events-none">TEXT TRACK</div>
            </div>

            <!-- TRACK 3: AUDIO / MUSIC -->
            <div class="timeline-track h-8 rounded-lg relative flex items-center px-1 w-[2000px]" id="audioTrackContainer">
                <div class="absolute left-2 text-[8px] font-cyber text-amber-400 font-bold opacity-30 pointer-events-none">AUDIO TRACK</div>
            </div>

        </div>
    </div>

    <!-- FULLSCREEN PREVIEW MODAL -->
    <div id="fullscreenModal" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl hidden flex flex-col items-center justify-between p-3">
        <div class="w-full max-w-lg flex items-center justify-between z-20">
            <span class="font-cyber text-xs font-bold text-white">Предпросмотр Эдита</span>
            <button onclick="closeFullscreenModal()" class="w-8 h-8 bg-zinc-900 border border-zinc-800 rounded-full flex items-center justify-center text-zinc-300">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div class="flex-1 w-full flex items-center justify-center my-auto relative">
            <canvas id="fullscreenCanvas" class="max-h-[82vh] max-w-full rounded-2xl border border-purple-500/40 shadow-2xl object-contain"></canvas>
        </div>

        <div class="w-full max-w-sm py-2 z-20 flex justify-center">
            <button onclick="togglePlay()" class="px-6 py-2.5 bg-purple-600 text-white font-cyber text-xs font-bold rounded-xl shadow-lg active:scale-95 transition">
                СТАРТ / ПАУЗА
            </button>
        </div>
    </div>

    <!-- EXPORT MODAL -->
    <div id="exportModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-[#09090b] border border-zinc-800 w-full max-w-xs rounded-2xl p-4 flex flex-col space-y-3 shadow-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <div class="flex items-center space-x-2">
                    <i data-lucide="download" class="w-4 h-4 text-cyan-400"></i>
                    <h3 class="font-cyber text-xs font-bold text-white">РЕНДЕР И ЭКСПОРТ MP4</h3>
                </div>
                <button onclick="closeExportModal()" class="w-6 h-6 bg-zinc-900 rounded-full border border-zinc-800 flex items-center justify-center text-zinc-400">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <div class="space-y-3 text-xs">
                <div>
                    <label class="font-bold text-zinc-300 block mb-1">Разрешение:</label>
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="setExportRes('360')" id="expRes360" class="exp-res-btn py-1.5 bg-zinc-900 border border-zinc-800 text-zinc-400 font-mono font-bold rounded-lg text-[10px]">360p</button>
                        <button onclick="setExportRes('480')" id="expRes480" class="exp-res-btn py-1.5 bg-zinc-900 border border-zinc-800 text-zinc-400 font-mono font-bold rounded-lg text-[10px]">480p</button>
                        <button onclick="setExportRes('720')" id="expRes720" class="exp-res-btn py-1.5 bg-purple-600 border border-purple-500 text-white font-mono font-bold rounded-lg text-[10px]">720p</button>
                        <button onclick="setExportRes('1080')" id="expRes1080" class="exp-res-btn py-1.5 bg-zinc-900 border border-zinc-800 text-zinc-400 font-mono font-bold rounded-lg text-[10px]">1080p</button>
                    </div>
                </div>

                <div>
                    <label class="font-bold text-zinc-300 block mb-1">FPS (Кадры в сек):</label>
                    <div class="grid grid-cols-2 gap-1.5">
                        <button onclick="setExportFps(30)" id="expFps30" class="exp-fps-btn py-1.5 bg-purple-600 border border-purple-500 text-white font-mono font-bold rounded-lg text-[10px]">30 FPS</button>
                        <button onclick="setExportFps(60)" id="expFps60" class="exp-fps-btn py-1.5 bg-zinc-900 border border-zinc-800 text-zinc-400 font-mono font-bold rounded-lg text-[10px]">60 FPS</button>
                    </div>
                </div>

                <div id="renderProgressContainer" class="hidden space-y-1.5 pt-2 border-t border-zinc-800 text-center">
                    <p id="renderStatusLabel" class="text-cyan-400 font-mono text-[10px]">Рендеринг кадров...</p>
                    <div class="w-full bg-zinc-900 h-1.5 rounded-full overflow-hidden border border-zinc-800">
                        <div id="renderProgressBar" class="bg-gradient-to-r from-purple-500 to-cyan-400 h-full w-0 transition-all duration-75"></div>
                    </div>
                    <span id="renderPercentText" class="text-zinc-400 font-mono text-[10px]">0%</span>
                </div>

                <button onclick="startVideoRender()" id="startRenderBtn" class="w-full py-2.5 bg-purple-600 text-white font-cyber text-xs font-bold rounded-xl active:scale-95 transition shadow-lg mt-1">
                    НАЧАТЬ РЕНДЕР MP4
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP ENGINE SCRIPT -->
    <script>
        lucide.createIcons();

        // INDEXED DB PERSISTENCE
        const DB_NAME = 'EditGodStudioDB_v13';
        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('project')) db.createObjectStore('project');
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveProjectState() {
            try {
                const db = await openDB();
                const tx = db.transaction('project', 'readwrite');
                const cleanClips = clips.map(c => ({
                    id: c.id, type: c.type, name: c.name, startSec: c.startSec, durationSec: c.durationSec,
                    src: c.type === 'text' ? null : c.src, text: c.text, font: c.font, color: c.color,
                    effect: c.effect, filter: c.filter, scale: c.scale, rotate: c.rotate, opacity: c.opacity
                }));
                tx.objectStore('project').put(cleanClips, 'clips');
            } catch(e) {}
        }

        async function clearProjectData() {
            if(confirm('Очистить проект и удалить все файлы?')) {
                try {
                    const db = await openDB();
                    const tx = db.transaction('project', 'readwrite');
                    tx.objectStore('project').clear();
                    clips = [];
                    selectedClipId = null;
                    currentTimeSec = 0;
                    renderTimelineUI();
                    renderCanvas();
                    showToast('Проект полностью очищен');
                } catch(e){}
            }
        }

        // APP STATE
        let clips = [];
        let selectedClipId = null;
        let isPlaying = false;
        let currentTimeSec = 0;
        let projectDurationSec = 10.0;
        let animationFrameId = null;
        let lastTimestamp = 0;

        let selectedExportRes = '720';
        let selectedExportFps = 30;
        let currentAspectRatio = '9:16';
        let pxPerSec = 25; // Scale factor for timeline

        // INITIALIZATION
        window.onload = async () => {
            setupCanvasDimensions();
            renderRulerTicks();
            setupPlayheadTouchScrubber();
            renderTimelineUI();

            // Restore from DB
            try {
                const db = await openDB();
                const tx = db.transaction('project', 'readonly');
                const reqClips = tx.objectStore('project').get('clips');
                reqClips.onsuccess = () => {
                    if (reqClips.result && Array.isArray(reqClips.result)) {
                        clips = reqClips.result;
                        clips.forEach(c => {
                            if (c.type === 'video') {
                                const v = document.createElement('video');
                                v.src = c.src; v.muted = true; v.loop = true;
                                c.mediaEl = v;
                            } else if (c.type === 'image') {
                                const img = new Image(); img.src = c.src;
                                c.mediaEl = img;
                            }
                        });
                        renderTimelineUI();
                        renderCanvas();
                    }
                };
            } catch(e) {}

            window.addEventListener('resize', setupCanvasDimensions);
        };

        function setupCanvasDimensions() {
            const viewport = document.getElementById('stageContainer');
            const canvas = document.getElementById('previewCanvas');
            const fullCanvas = document.getElementById('fullscreenCanvas');

            let w = 720, h = 1280;
            if (currentAspectRatio === '16:9') { w = 1280; h = 720; viewport.style.aspectRatio = '16/9'; }
            else if (currentAspectRatio === '1:1') { w = 1080; h = 1080; viewport.style.aspectRatio = '1/1'; }
            else { w = 720; h = 1280; viewport.style.aspectRatio = '9/16'; }

            canvas.width = w; canvas.height = h;
            fullCanvas.width = w; fullCanvas.height = h;
            renderCanvas();
        }

        function changeAspectRatio(val) {
            currentAspectRatio = val;
            setupCanvasDimensions();
        }

        // TOUCH DRAGGABLE SCRUBBER LOGIC (ANDROID / MOBILE PERFECT SCRUBBING)
        function setupPlayheadTouchScrubber() {
            const scrollArea = document.getElementById('timelineScrollArea');
            const knob = document.getElementById('playheadKnob');
            const ruler = document.getElementById('timelineRuler');
            let isDragging = false;

            function updateTimeFromTouch(clientX) {
                const rect = scrollArea.getBoundingClientRect();
                const scrollLeft = scrollArea.scrollLeft;
                let offsetX = clientX - rect.left + scrollLeft - 12; // 12px padding offset
                offsetX = Math.max(0, offsetX);

                let targetSec = offsetX / pxPerSec;
                currentTimeSec = Math.max(0, Math.min(targetSec, projectDurationSec));

                document.getElementById('timecodeDisplay').textContent = formatTimecode(currentTimeSec);
                updatePlayheadUI();
                renderCanvas();
            }

            // Knob Touch events
            knob.addEventListener('pointerdown', (e) => {
                isDragging = true;
                knob.setPointerCapture(e.pointerId);
                updateTimeFromTouch(e.clientX);
            });

            knob.addEventListener('pointermove', (e) => {
                if (isDragging) updateTimeFromTouch(e.clientX);
            });

            const stopDrag = (e) => {
                if (isDragging) {
                    isDragging = false;
                    try { knob.releasePointerCapture(e.pointerId); } catch(err){}
                }
            };
            knob.addEventListener('pointerup', stopDrag);
            knob.addEventListener('pointercancel', stopDrag);

            // Tap anywhere on ruler to move playhead
            ruler.addEventListener('pointerdown', (e) => {
                updateTimeFromTouch(e.clientX);
            });
        }

        function updatePlayheadUI() {
            const group = document.getElementById('playheadGroup');
            group.style.left = `${currentTimeSec * pxPerSec + 12}px`;
        }

        function renderRulerTicks() {
            const ruler = document.getElementById('timelineRuler');
            ruler.innerHTML = '';
            for (let s = 0; s <= 80; s += 2) {
                const tick = document.createElement('div');
                tick.className = "absolute text-[8px] font-mono text-zinc-500 border-l border-zinc-700 h-3 flex items-end pl-0.5 select-none";
                tick.style.left = `${s * pxPerSec + 12}px`;
                tick.textContent = `${s}s`;
                ruler.appendChild(tick);
            }
        }

        // INSPECTOR TABS SWITCHING
        function switchInspectorTab(tab) {
            document.querySelectorAll('.inspector-tab').forEach(b => {
                b.className = "inspector-tab flex-1 py-2.5 flex items-center justify-center space-x-1 border-b-2 border-transparent hover:text-zinc-200";
            });
            ['media','fx','text','anim'].forEach(t => {
                document.getElementById(`tabContent${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.add('hidden');
            });

            document.getElementById(`tabBtn${tab.charAt(0).toUpperCase() + tab.slice(1)}`).className = "inspector-tab flex-1 py-2.5 flex items-center justify-center space-x-1 border-b-2 border-purple-500 text-purple-400 font-bold";
            document.getElementById(`tabContent${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
        }

        // MEDIA IMPORT
        function handleImportMedia(e) {
            const files = e.target.files;
            if(!files || files.length === 0) return;

            for(let i = 0; i < files.length; i++) {
                const file = files[i];
                const url = URL.createObjectURL(file);
                const type = file.type.startsWith('video') ? 'video' : (file.type.startsWith('audio') ? 'audio' : 'image');

                const newClip = {
                    id: Date.now() + Math.random(),
                    type: type,
                    name: file.name,
                    src: url,
                    startSec: currentTimeSec,
                    durationSec: 4.0,
                    effect: 'none', filter: 'none',
                    scale: 100, rotate: 0, opacity: 100
                };

                if (type === 'video') {
                    const v = document.createElement('video'); v.src = url; v.muted = true; v.loop = true;
                    newClip.mediaEl = v;
                } else if (type === 'image') {
                    const img = new Image(); img.src = url;
                    newClip.mediaEl = img;
                }

                clips.push(newClip);
            }

            saveProjectState();
            renderTimelineUI();
            renderCanvas();
            showToast('Файлы добавлена на дорожку');
        }

        function addPresetAudio(name, url) {
            const newClip = {
                id: Date.now() + Math.random(),
                type: 'audio',
                name: name,
                src: url,
                startSec: currentTimeSec,
                durationSec: 10.0
            };
            clips.push(newClip);
            saveProjectState();
            renderTimelineUI();
            showToast('Аудио добавлен');
        }

        // TEXT LAYER
        function addNewTextLayer() {
            const inputVal = document.getElementById('textLayerInput').value || 'EDIT GOD';
            const newText = {
                id: Date.now() + Math.random(),
                type: 'text',
                name: 'ТЕКСТ',
                text: inputVal,
                font: 'Russo One',
                color: '#ffffff',
                startSec: currentTimeSec,
                durationSec: 5.0,
                scale: 100, rotate: 0, opacity: 100
            };
            clips.push(newText);
            selectedClipId = newText.id;
            saveProjectState();
            renderTimelineUI();
            renderCanvas();
            showToast('Текст добавлен');
        }

        function updateActiveTextLayer() {
            if(!selectedClipId) return;
            const clip = clips.find(c => c.id === selectedClipId);
            if(clip && clip.type === 'text') {
                clip.text = document.getElementById('textLayerInput').value || 'EDIT GOD';
                saveProjectState();
                renderCanvas();
            }
        }

        // EFFECTS & FILTERS
        function applyEffectToSelected(effectName) {
            if(!selectedClipId) return alert('Сначала нажмите на клип на дорожке!');
            const clip = clips.find(c => c.id === selectedClipId);
            if(clip) {
                clip.effect = effectName;
                saveProjectState();
                renderCanvas();
                showToast(`Эффект ${effectName} включен`);
            }
        }

        function applyFilterToSelected(filterStr) {
            if(!selectedClipId) return;
            const clip = clips.find(c => c.id === selectedClipId);
            if(clip) {
                clip.filter = filterStr;
                saveProjectState();
                renderCanvas();
            }
        }

        function updateClipTransform() {
            if(!selectedClipId) return;
            const clip = clips.find(c => c.id === selectedClipId);
            if(clip) {
                clip.scale = parseInt(document.getElementById('scaleSlider').value);
                clip.rotate = parseInt(document.getElementById('rotateSlider').value);
                clip.opacity = parseInt(document.getElementById('opacitySlider').value);

                document.getElementById('scaleValText').textContent = clip.scale + '%';
                document.getElementById('rotateValText').textContent = clip.rotate + '°';
                document.getElementById('opacityValText').textContent = clip.opacity + '%';

                saveProjectState();
                renderCanvas();
            }
        }

        // TIMELINE RENDER & CLIPS
        function renderTimelineUI() {
            const vTrack = document.getElementById('videoTrackContainer');
            const tTrack = document.getElementById('textTrackContainer');
            const aTrack = document.getElementById('audioTrackContainer');

            vTrack.querySelectorAll('.timeline-clip').forEach(el => el.remove());
            tTrack.querySelectorAll('.timeline-clip').forEach(el => el.remove());
            aTrack.querySelectorAll('.timeline-clip').forEach(el => el.remove());

            let maxDur = 10.0;

            clips.forEach(clip => {
                if (clip.startSec + clip.durationSec > maxDur) maxDur = clip.startSec + clip.durationSec;

                const clipEl = document.createElement('div');
                const isSel = clip.id === selectedClipId;
                const leftPx = clip.startSec * pxPerSec + 12;
                const widthPx = Math.max(30, clip.durationSec * pxPerSec);

                let bgClass = "bg-purple-900/80 border-purple-500/80 text-purple-200";
                if (clip.type === 'text') bgClass = "bg-cyan-900/80 border-cyan-500/80 text-cyan-200";
                if (clip.type === 'audio') bgClass = "bg-amber-900/80 border-amber-500/80 text-amber-200";

                clipEl.className = `timeline-clip absolute h-7 rounded-md border px-1.5 text-[9px] font-mono font-bold flex items-center justify-between truncate ${bgClass} ${isSel ? 'selected' : ''}`;
                clipEl.style.left = `${leftPx}px`;
                clipEl.style.width = `${widthPx}px`;

                clipEl.onclick = (e) => {
                    e.stopPropagation();
                    selectClip(clip.id);
                };

                clipEl.innerHTML = `
                    <span class="truncate">${clip.name || clip.text}</span>
                    <span class="text-[8px] opacity-70 ml-1">${clip.durationSec.toFixed(1)}s</span>
                `;

                if (clip.type === 'video' || clip.type === 'image') vTrack.appendChild(clipEl);
                else if (clip.type === 'text') tTrack.appendChild(clipEl);
                else if (clip.type === 'audio') aTrack.appendChild(clipEl);
            });

            projectDurationSec = maxDur;
            document.getElementById('totalTimeDisplay').textContent = formatTimecode(projectDurationSec);
            updatePlayheadUI();

            document.getElementById('emptyCanvasNotice').style.display = clips.length > 0 ? 'none' : 'flex';
        }

        function selectClip(id) {
            selectedClipId = id;
            const clip = clips.find(c => c.id === id);
            if(clip) {
                if(clip.type === 'text') {
                    switchInspectorTab('text');
                    document.getElementById('textLayerInput').value = clip.text;
                } else {
                    switchInspectorTab('anim');
                    document.getElementById('scaleSlider').value = clip.scale || 100;
                    document.getElementById('rotateSlider').value = clip.rotate || 0;
                    document.getElementById('opacitySlider').value = clip.opacity || 100;
                }
            }
            renderTimelineUI();
        }

        function splitActiveClip() {
            if(!selectedClipId) return alert('Нажмите на клип на дорожке!');
            const index = clips.findIndex(c => c.id === selectedClipId);
            if(index !== -1) {
                const c = clips[index];
                const splitPoint = currentTimeSec - c.startSec;
                if(splitPoint > 0.3 && splitPoint < c.durationSec - 0.3) {
                    const originalDur = c.durationSec;
                    c.durationSec = splitPoint;

                    const newHalf = { ...c, id: Date.now() + Math.random(), startSec: currentTimeSec, durationSec: originalDur - splitPoint };
                    clips.push(newHalf);
                    saveProjectState();
                    renderTimelineUI();
                    showToast('Клип разрезан');
                }
            }
        }

        function deleteActiveClip() {
            if(!selectedClipId) return;
            clips = clips.filter(c => c.id !== selectedClipId);
            selectedClipId = null;
            saveProjectState();
            renderTimelineUI();
            renderCanvas();
            showToast('Клип удален');
        }

        // PLAYBACK ENGINE
        function togglePlay() {
            isPlaying = !isPlaying;
            const playBtnText = document.getElementById('masterPlayText');
            const playIcon = document.getElementById('masterPlayIcon');
            
            if(isPlaying) {
                playBtnText.textContent = "ПАУЗА";
                playIcon.setAttribute('data-lucide', 'pause');
                lastTimestamp = performance.now();
                animationFrameId = requestAnimationFrame(playbackLoop);
            } else {
                playBtnText.textContent = "ИГРАТЬ";
                playIcon.setAttribute('data-lucide', 'play');
                if(animationFrameId) cancelAnimationFrame(animationFrameId);
            }
            lucide.createIcons();
        }

        function playbackLoop(timestamp) {
            if(!isPlaying) return;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            currentTimeSec += delta;
            if(currentTimeSec >= projectDurationSec) {
                currentTimeSec = 0;
            }

            document.getElementById('timecodeDisplay').textContent = formatTimecode(currentTimeSec);
            updatePlayheadUI();
            renderCanvas();

            animationFrameId = requestAnimationFrame(playbackLoop);
        }

        // CANVAS RENDERING
        function renderCanvas() {
            const canvas = document.getElementById('previewCanvas');
            const fullCanvas = document.getElementById('fullscreenCanvas');
            const ctx = canvas.getContext('2d');
            const fullCtx = fullCanvas.getContext('2d');

            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, w, h);

            const activeVisuals = clips.filter(c => (c.type === 'video' || c.type === 'image') && currentTimeSec >= c.startSec && currentTimeSec <= c.startSec + c.durationSec);

            activeVisuals.forEach(c => {
                ctx.save();
                const p = (currentTimeSec - c.startSec) / c.durationSec;

                let scale = (c.scale || 100) / 100;
                let rotate = ((c.rotate || 0) * Math.PI) / 180;
                let opacity = (c.opacity || 100) / 100;
                let offsetX = 0, offsetY = 0;

                if (c.effect === 'phonkShake') {
                    scale *= 1.05 + Math.sin(p * Math.PI * 12) * 0.08;
                    offsetX = Math.sin(p * Math.PI * 20) * (w * 0.02);
                    offsetY = Math.cos(p * Math.PI * 20) * (h * 0.015);
                } else if (c.effect === 'glitchCyber') {
                    if (Math.sin(p * Math.PI * 15) > 0.5) {
                        offsetX = (Math.random() - 0.5) * (w * 0.05);
                        ctx.filter = "hue-rotate(90deg) invert(0.2)";
                    }
                } else if (c.effect === 'zoomBounce') {
                    scale *= 1.0 + Math.abs(Math.sin(p * Math.PI * 4)) * 0.2;
                } else if (c.effect === 'flashBeat') {
                    if (Math.sin(p * Math.PI * 8) > 0.8) {
                        document.getElementById('flashOverlay').style.opacity = '0.6';
                        setTimeout(() => document.getElementById('flashOverlay').style.opacity = '0', 50);
                    }
                }

                if (c.filter && c.filter !== 'none') {
                    ctx.filter = (ctx.filter === 'none' ? '' : ctx.filter + ' ') + c.filter;
                }

                ctx.globalAlpha = opacity;
                ctx.translate(w / 2 + offsetX, h / 2 + offsetY);
                ctx.rotate(rotate);
                ctx.scale(scale, scale);

                if (c.mediaEl) {
                    if (c.type === 'video' && c.mediaEl.paused) c.mediaEl.play();
                    const imgAspect = c.mediaEl.videoWidth ? (c.mediaEl.videoWidth / c.mediaEl.videoHeight) : (c.mediaEl.width / c.mediaEl.height);
                    const canvasAspect = w / h;
                    let drawW, drawH;
                    if (imgAspect > canvasAspect) { drawH = h; drawW = h * imgAspect; }
                    else { drawW = w; drawH = w / imgAspect; }

                    ctx.drawImage(c.mediaEl, -drawW / 2, -drawH / 2, drawW, drawH);
                }

                ctx.restore();
            });

            // Text Layers
            const activeTexts = clips.filter(c => c.type === 'text' && currentTimeSec >= c.startSec && currentTimeSec <= c.startSec + c.durationSec);

            activeTexts.forEach(c => {
                ctx.save();
                ctx.font = `900 ${Math.round(w * 0.08)}px "${c.font || 'Russo One'}"`;
                ctx.fillStyle = c.color || '#ffffff';
                ctx.textAlign = 'center';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 5;

                ctx.strokeText(c.text, w / 2, h / 2);
                ctx.fillText(c.text, w / 2, h / 2);
                ctx.restore();
            });

            // Mirror
            fullCtx.clearRect(0, 0, w, h);
            fullCtx.drawImage(canvas, 0, 0);
        }

        // EXPORT SYSTEM
        function openExportModal() { document.getElementById('exportModal').classList.remove('hidden'); }
        function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }

        function setExportRes(res) {
            selectedExportRes = res;
            document.querySelectorAll('.exp-res-btn').forEach(b => b.className = "exp-res-btn py-1.5 bg-zinc-900 border border-zinc-800 text-zinc-400 font-mono font-bold rounded-lg text-[10px]");
            document.getElementById(`expRes${res}`).className = "exp-res-btn py-1.5 bg-purple-600 border border-purple-500 text-white font-mono font-bold rounded-lg text-[10px]";
        }

        function setExportFps(fps) {
            selectedExportFps = fps;
            document.querySelectorAll('.exp-fps-btn').forEach(b => b.className = "exp-fps-btn py-1.5 bg-zinc-900 border border-zinc-800 text-zinc-400 font-mono font-bold rounded-lg text-[10px]");
            document.getElementById(`expFps${fps}`).className = "exp-fps-btn py-1.5 bg-purple-600 border border-purple-500 text-white font-mono font-bold rounded-lg text-[10px]";
        }

        async function startVideoRender() {
            const canvas = document.getElementById('previewCanvas');
            const progressBox = document.getElementById('renderProgressContainer');
            const progressBar = document.getElementById('renderProgressBar');
            const percentText = document.getElementById('renderPercentText');

            progressBox.classList.remove('hidden');
            document.getElementById('startRenderBtn').disabled = true;

            const fps = selectedExportFps;
            const totalFrames = Math.floor(projectDurationSec * fps);
            const stream = canvas.captureStream(fps);

            let mimeType = 'video/mp4';
            if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';

            const mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
            const chunks = [];
            mediaRecorder.ondataavailable = e => chunks.push(e.data);

            const renderPromise = new Promise(res => {
                mediaRecorder.onstop = () => res(new Blob(chunks, { type: mimeType }));
            });

            mediaRecorder.start();

            for (let f = 0; f < totalFrames; f++) {
                currentTimeSec = f / fps;
                renderCanvas();

                const pct = Math.floor(((f + 1) / totalFrames) * 100);
                progressBar.style.width = pct + '%';
                percentText.textContent = pct + '%';

                await new Promise(r => setTimeout(r, 1000 / (fps * 2)));
            }

            mediaRecorder.stop();
            const blob = await renderPromise;

            progressBox.classList.add('hidden');
            document.getElementById('startRenderBtn').disabled = false;
            closeExportModal();

            confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 } });
            
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `EDIT_GOD_${Date.now()}.mp4`;
            a.click();
            showToast('Готовое MP4 сохранено!');
        }

        function openFullscreenModal() { document.getElementById('fullscreenModal').classList.remove('hidden'); }
        function closeFullscreenModal() { document.getElementById('fullscreenModal').classList.add('hidden'); }

        function formatTimecode(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            const ms = Math.floor((sec % 1) * 10);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}.${ms}`;
        }

        function showToast(text) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-12 left-1/2 -translate-x-1/2 z-50 bg-zinc-900 border border-purple-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-2xl animate-bounce";
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
    </script>
