<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Java → APK Компилятор</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#0d1117; color:#c9d1d9; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}
header {
  background:#161b22; border-bottom:1px solid #30363d; padding:12px 16px;
  position:sticky; top:0; z-index:100;
}
header h1 { font-size:16px; color:#58a6ff; display:flex; align-items:center; gap:8px; }
header h1::before { content:"⚡"; }
.container { flex:1; padding:12px; max-width:100%; }
.section { background:#161b22; border:1px solid #30363d; border-radius:12px; margin-bottom:12px; overflow:hidden; }
.section-title {
  background:#21262d; padding:10px 14px; font-size:13px; font-weight:600; color:#8b949e;
  display:flex; align-items:center; gap:6px;
}
.section-body { padding:12px; }
label { display:block; font-size:12px; color:#8b949e; margin-bottom:4px; }
input[type="text"], select {
  width:100%; background:#0d1117; border:1px solid #30363d; border-radius:8px;
  padding:10px 12px; color:#c9d1d9; font-size:14px; outline:none; margin-bottom:8px;
}
input:focus, select:focus { border-color:#58a6ff; }
textarea {
  width:100%; background:#0d1117; border:1px solid #30363d; border-radius:8px;
  padding:12px; color:#c9d1d9; font-size:13px; font-family:"SF Mono", Monaco, monospace;
  outline:none; resize:vertical; min-height:280px; line-height:1.6;
}
textarea:focus { border-color:#58a6ff; }
.btn {
  width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-weight:600;
  cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary { background:#238636; color:#fff; }
.btn-primary:active { background:#2ea043; transform:scale(.98); }
.btn-secondary { background:#1f6feb; color:#fff; margin-top:8px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.status {
  padding:12px; border-radius:8px; font-size:13px; margin-top:12px; display:none;
}
.status.show { display:block; }
.status-info { background:rgba(88,166,255,.1); border:1px solid rgba(88,166,255,.3); color:#58a6ff; }
.status-success { background:rgba(35,134,54,.1); border:1px solid rgba(35,134,54,.3); color:#3fb950; }
.status-error { background:rgba(248,81,73,.1); border:1px solid rgba(248,81,73,.3); color:#f85149; }
.status-warn { background:rgba(210,153,34,.1); border:1px solid rgba(210,153,34,.3); color:#d29922; }
.apk-link {
  display:block; margin-top:10px; padding:12px; background:#238636; color:#fff;
  text-align:center; border-radius:10px; text-decoration:none; font-weight:600;
}
.apk-link:active { background:#2ea043; }
.logs {
  background:#0d1117; border:1px solid #30363d; border-radius:8px; padding:10px;
  font-family:"SF Mono", monospace; font-size:11px; color:#8b949e; max-height:150px;
  overflow-y:auto; margin-top:10px; white-space:pre-wrap; word-break:break-all;
}
.template-btn {
  display:inline-block; padding:6px 12px; background:#21262d; border:1px solid #30363d;
  border-radius:6px; font-size:11px; color:#8b949e; margin:0 4px 4px 0; cursor:pointer;
}
.template-btn:active { background:#30363d; color:#c9d1d9; }
.hint { font-size:11px; color:#484f58; margin-top:4px; }
.spinner {
  width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff;
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }
footer { text-align:center; padding:16px; font-size:11px; color:#484f58; }
</style>
</head>
<body>
<header>
  <h1>Java → APK Компилятор</h1>
</header>

<div class="container">
  <div class="section">
    <div class="section-title">📱 Настройки приложения</div>
    <div class="section-body">
      <label>Название приложения</label>
      <input type="text" id="appName" value="MyApp" placeholder="MyApp">
      <label>Package name</label>
      <input type="text" id="packageName" value="com.example.myapp" placeholder="com.example.myapp">
      <label>Min SDK</label>
      <select id="minSdk">
        <option value="21">API 21 (Android 5.0)</option>
        <option value="24">API 24 (Android 7.0)</option>
        <option value="26" selected>API 26 (Android 8.0)</option>
        <option value="28">API 28 (Android 9.0)</option>
        <option value="30">API 30 (Android 11)</option>
      </select>
    </div>
  </div>

  <div class="section">
    <div class="section-title">📝 Java код</div>
    <div class="section-body">
      <div style="margin-bottom:8px;">
        <span class="template-btn" onclick="loadTemplate('hello')">Hello World</span>
        <span class="template-btn" onclick="loadTemplate('button')">Кнопка</span>
        <span class="template-btn" onclick="loadTemplate('webview')">WebView</span>
        <span class="template-btn" onclick="loadTemplate('calc')">Калькулятор</span>
      </div>
      <textarea id="javaCode" spellcheck="false" placeholder="// Вставь свой Java код здесь...">package com.example.myapp;

import android.app.Activity;
import android.os.Bundle;
import android.widget.TextView;

public class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        TextView tv = new TextView(this);
        tv.setText("Hello World!");
        tv.setTextSize(24);
        setContentView(tv);
    }
}</textarea>
      <div class="hint">Пиши код класса MainActivity. Остальное (AndroidManifest, ресурсы) соберётся автоматически.</div>
    </div>
  </div>

  <div class="section">
    <div class="section-body">
      <button class="btn btn-primary" id="buildBtn" onclick="buildApk()">
        <span id="btnText">🔨 Собрать APK</span>
      </button>
      <div class="status" id="status"></div>
      <div class="logs" id="logs" style="display:none;"></div>
    </div>
  </div>
</div>

<footer>
  Работает через Render • Мобильная версия
</footer>

<script>
const RENDER_URL = "https://android-compiler-api.onrender.com"; // ЗАМЕНИ НА СВОЙ URL

const templates = {
  hello: `package com.example.myapp;

import android.app.Activity;
import android.os.Bundle;
import android.widget.TextView;

public class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        TextView tv = new TextView(this);
        tv.setText("Hello World!");
        tv.setTextSize(24);
        setContentView(tv);
    }
}`,
  button: `package com.example.myapp;

import android.app.Activity;
import android.os.Bundle;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.Toast;

public class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        LinearLayout layout = new LinearLayout(this);
        layout.setOrientation(LinearLayout.VERTICAL);
        layout.setPadding(40, 40, 40, 40);

        Button btn = new Button(this);
        btn.setText("Нажми меня");
        btn.setOnClickListener(v -> Toast.makeText(this, "Привет!", Toast.LENGTH_SHORT).show());
        layout.addView(btn);

        setContentView(layout);
    }
}`,
  webview: `package com.example.myapp;

import android.app.Activity;
import android.os.Bundle;
import android.webkit.WebView;
import android.webkit.WebViewClient;

public class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView webView = new WebView(this);
        webView.setWebViewClient(new WebViewClient());
        webView.getSettings().setJavaScriptEnabled(true);
        webView.loadUrl("https://example.com");
        setContentView(webView);
    }
}`,
  calc: `package com.example.myapp;

import android.app.Activity;
import android.os.Bundle;
import android.widget.Button;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.TextView;

public class MainActivity extends Activity {
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        LinearLayout layout = new LinearLayout(this);
        layout.setOrientation(LinearLayout.VERTICAL);
        layout.setPadding(40, 40, 40, 40);

        EditText a = new EditText(this);
        a.setHint("Число A");
        layout.addView(a);

        EditText b = new EditText(this);
        b.setHint("Число B");
        layout.addView(b);

        TextView result = new TextView(this);
        result.setTextSize(18);
        layout.addView(result);

        Button btn = new Button(this);
        btn.setText("Сложить");
        btn.setOnClickListener(v -> {
            try {
                int sum = Integer.parseInt(a.getText().toString()) + Integer.parseInt(b.getText().toString());
                result.setText("Результат: " + sum);
            } catch(Exception e) {
                result.setText("Ошибка ввода");
            }
        });
        layout.addView(btn);

        setContentView(layout);
    }
}`
};

function loadTemplate(name) {
  document.getElementById('javaCode').value = templates[name];
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.className = 'status show status-' + type;
  el.innerHTML = msg;
}

function addLog(line) {
  const el = document.getElementById('logs');
  el.style.display = 'block';
  el.textContent += line + '\n';
  el.scrollTop = el.scrollHeight;
}

async function buildApk() {
  const btn = document.getElementById('buildBtn');
  const btnText = document.getElementById('btnText');
  const logs = document.getElementById('logs');

  btn.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Компиляция...';
  document.getElementById('status').className = 'status';
  logs.style.display = 'none';
  logs.textContent = '';

  const data = {
    appName: document.getElementById('appName').value || 'MyApp',
    packageName: document.getElementById('packageName').value || 'com.example.myapp',
    minSdk: parseInt(document.getElementById('minSdk').value),
    javaCode: document.getElementById('javaCode').value
  };

  try {
    setStatus('⏳ Отправка на сервер...', 'info');

    const res = await fetch(RENDER_URL + '/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await res.json();

    if (result.logs) {
      result.logs.forEach(l => addLog(l));
    }

    if (result.success && result.downloadUrl) {
      setStatus(
        '✅ APK собран!<br><a class="apk-link" href="' + result.downloadUrl + '" download>Скачать ' + result.appName + '.apk</a>',
        'success'
      );
    } else {
      setStatus('❌ Ошибка: ' + (result.error || 'Неизвестная ошибка'), 'error');
    }
  } catch(e) {
    setStatus('❌ Ошибка сети. Сервер спит? Подожди 30 сек и попробуй снова.<br><small>' + e.message + '</small>', 'error');
  }

  btn.disabled = false;
  btnText.textContent = '🔨 Собрать APK';
}
</script>
</body>
</html>
