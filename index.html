<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>TG Anon Comments</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 400px;
      background: #141414;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid #222;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #0088cc, #00a8e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #888; font-size: 13px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #0088cc; }
    button {
      width: 100%;
      background: linear-gradient(135deg, #0088cc, #00a8e8);
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .status.ok { display: block; background: #1b5e20; color: #69f0ae; }
    .status.err { display: block; background: #b71c1c; color: #ff8a80; }
  </style>
</head>
<body>
  <div class="box">
    <h1>TG Anon Comments</h1>
    <p>Бот удаляет комментарии и пишет их от своего имени</p>

    <div class="input-group">
      <label>Bot Token</label>
      <input type="text" id="token" placeholder="123456:ABC-DEF..." autocomplete="off">
    </div>

    <div class="input-group">
      <label>Chat ID (чат комментариев)</label>
      <input type="text" id="chatId" placeholder="-1001234567890" autocomplete="off">
    </div>

    <button id="btn" onclick="start()">Запустить бота</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    async function start() {
      const token = document.getElementById('token').value.trim();
      const chatId = document.getElementById('chatId').value.trim();
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      if (!token || !chatId) {
        show('err', 'Заполни все поля');
        return;
      }

      btn.disabled = true;
      show('ok', 'Запускаю...');

      try {
        const res = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, chatId })
        });

        const data = await res.json();
        if (data.success) {
          show('ok', 'Бот запущен! Оставь вкладку открытой.');
        } else {
          show('err', data.error || 'Ошибка');
        }
      } catch (e) {
        show('err', 'Ошибка сети');
      } finally {
        btn.disabled = false;
      }
    }

    function show(type, text) {
      const el = document.getElementById('status');
      el.className = 'status ' + (type === 'ok' ? 'ok' : 'err');
      el.textContent = text;
    }
  </script>
</body>
</html>
