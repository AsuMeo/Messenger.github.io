<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TG BOT PLATFORM 2026 - PURE OLED BLACK</title>
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #000000;
            --bg-card: #0a0a0c;
            --bg-chat: #000000;
            --bg-bubble-in: #111115;
            --bg-bubble-out: #1a1a24;
            --border-dark: #18181b;
            --border-light: #27272a;
            --accent-green: #10b981;
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-pink: #ec4899;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-black);
            color: var(--text-primary);
        }

        .app-shell {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            background: var(--bg-black);
        }

        /* SIDEBAR / BOT LIST */
        .sidebar {
            width: 100%;
            height: 100%;
            background-color: var(--bg-black);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 10;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 1px solid var(--border-dark);
        }

        .app-shell.chat-active .sidebar {
            transform: translateX(-30%);
            pointer-events: none;
        }

        .app-header {
            height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #050507;
            border-bottom: 1px solid var(--border-dark);
            z-index: 5;
            flex-shrink: 0;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-logo svg {
            width: 22px;
            height: 22px;
            fill: var(--accent-green);
        }

        .badge-2026 {
            font-size: 0.65rem;
            font-weight: 800;
            background: #111115;
            color: var(--accent-green);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-dark);
            letter-spacing: 0.05em;
        }

        .search-wrapper {
            padding: 10px 14px;
            background-color: var(--bg-black);
            border-bottom: 1px solid var(--border-dark);
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #0f0f12;
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            padding: 8px 12px;
            gap: 10px;
        }

        .search-bar svg {
            width: 16px;
            height: 16px;
            fill: var(--text-muted);
        }

        .search-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 0.88rem;
        }

        /* BOT LIST SCROLL */
        .bot-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .bot-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid #0c0c0e;
            transition: background 0.12s ease;
        }

        .bot-card:active {
            background-color: #0f0f14;
        }

        .bot-avatar-box {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
            background: #111115;
            border: 1px solid var(--border-dark);
        }

        .bot-avatar-box svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            position: absolute;
            bottom: -2px;
            right: -2px;
            border: 2px solid var(--bg-black);
        }

        .bot-info {
            flex: 1;
            min-width: 0;
        }

        .bot-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .bot-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bot-time {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .bot-subtext {
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CHAT VIEW */
        .chat-view {
            width: 100%;
            height: 100%;
            background-color: var(--bg-chat);
            display: flex;
            flex-direction: column;
            position: absolute;
            right: 0;
            top: 0;
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-shell.chat-active .chat-view {
            transform: translateX(0);
        }

        .btn-icon-nav {
            background: none;
            border: none;
            color: var(--text-primary);
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-icon-nav:active {
            background: #18181b;
        }

        .btn-icon-nav svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        /* MESSAGES AREA */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .msg-group {
            display: flex;
            flex-direction: column;
            max-width: 88%;
        }

        .msg-group.in { align-self: flex-start; }
        .msg-group.out { align-self: flex-end; }

        .msg-bubble {
            padding: 11px 15px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.48;
            word-break: break-word;
            position: relative;
            user-select: text;
        }

        .msg-group.in .msg-bubble {
            background-color: var(--bg-bubble-in);
            color: var(--text-primary);
            border: 1px solid var(--border-dark);
            border-bottom-left-radius: 4px;
        }

        .msg-group.out .msg-bubble {
            background-color: var(--bg-bubble-out);
            color: #ffffff;
            border: 1px solid var(--border-light);
            border-bottom-right-radius: 4px;
        }

        .msg-time {
            font-size: 0.65rem;
            color: var(--text-muted);
            float: right;
            margin-left: 10px;
            margin-top: 4px;
        }

        .media-preview-img, .media-preview-video {
            width: 100%;
            max-width: 300px;
            border-radius: 10px;
            margin-top: 8px;
            margin-bottom: 4px;
            display: block;
            border: 1px solid var(--border-dark);
            background: #000;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-action {
            background: #111116;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.78rem;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-action:active {
            background: var(--text-primary);
            color: #000;
        }

        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #10b981;
            color: #000000;
            padding: 9px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 700;
            margin-top: 8px;
        }

        /* TYPING INDICATOR */
        .typing-bar {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding: 8px 14px;
            background: var(--bg-bubble-in);
            border-radius: 14px;
            width: fit-content;
            margin-left: 14px;
            margin-bottom: 8px;
            border: 1px solid var(--border-dark);
        }

        .dot {
            width: 5px;
            height: 5px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out both;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        /* INPUT CONTROL BAR */
        .input-control-bar {
            background-color: #050507;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid var(--border-dark);
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: #111115;
            border: 1px solid var(--border-dark);
            border-radius: 20px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            user-select: text;
        }

        .chat-input:focus {
            border-color: var(--border-light);
        }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--text-primary);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-send svg {
            width: 18px;
            height: 18px;
            fill: #000000;
        }

        /* MODAL CANVAS FILTER */
        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-backdrop.open {
            display: flex;
        }

        .modal-card {
            background: #09090c;
            border: 1px solid var(--border-dark);
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-head {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent-green);
            text-align: center;
        }

        .canvas-render {
            width: 100%;
            max-height: 230px;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
            border: 1px solid var(--border-dark);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-height: 120px;
            overflow-y: auto;
        }

        .btn-filter {
            background: #111115;
            color: var(--text-primary);
            border: 1px solid var(--border-dark);
            padding: 7px 4px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn-filter.active {
            border-color: var(--accent-green);
            background: #10b981;
            color: #000;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }

        .btn-m {
            flex: 1;
            padding: 11px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-m-cancel { background: #27272a; color: #fff; }
        .btn-m-apply { background: var(--accent-green); color: #000; }

        #file-gallery-input { display: none; }
    </style>
</head>
<body>

<div class="app-shell" id="app">

    <!-- SIDEBAR: BOT LIST -->
    <div class="sidebar">
        <div class="app-header">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <span>TG PLATFORM 2026</span>
            </div>
            <span class="badge-2026">44 БОТА • OLED</span>
        </div>

        <div class="search-wrapper">
            <div class="search-bar">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

            </div>
        </div>

        <div class="bot-list" id="bot-list">
            <!-- Dynamic items generated via JS -->
        </div>
    </div>

    <!-- CHAT VIEW -->
    <div class="chat-view">
        <div class="app-header">
            <button class="btn-icon-nav" id="btn-back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="bot-avatar-box" id="active-avatar" style="width:36px; height:36px;">
                <svg viewBox="0 0 24 24"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7v1h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1v-1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
            </div>
            <div style="flex:1; min-width:0; margin-left:10px;">
                <div id="active-name" style="font-size:0.92rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Выберите бота</div>
                <div id="active-status" style="font-size:0.68rem; color:var(--accent-green);">онлайн • Live API 2026</div>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <!-- Messages render -->
        </div>

        <div class="typing-bar" id="typing-bar">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <span id="typing-text" style="margin-left:4px">Бот выполняет сетевой запрос...</span>
        </div>

        <div class="input-control-bar">
            <button class="btn-icon-nav" id="btn-attach" title="Прикрепить фото из галереи">
                <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .83-.67 1.5-1.5 1.5s-1.5-.67-1.5-1.5V6H9v9.5a3 3 0 0 0 6 0V5a4 4 0 0 0-8 0v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
            </button>
            <input type="file" id="file-gallery-input" accept="image/*">
            <input type="text" id="chat-input" class="chat-input" placeholder="Сообщение или ссылка..." autocomplete="off">
            <button class="btn-send" id="btn-send">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

</div>

<!-- MODAL FILTER EDITOR FOR GALLERY PHOTO -->
<div class="modal-backdrop" id="modal-editor">
    <div class="modal-card">
        <div class="modal-head">✨ Обработка Фото из Галереи</div>
        <canvas id="canvas-preview" class="canvas-render"></canvas>
        
        <div style="font-size:0.75rem; color:var(--text-muted)">Выберите эффект эффекта:</div>
        <div class="filter-grid" id="filter-buttons">
            <button class="btn-filter active" data-f="cyber">Cyberpunk</button>
            <button class="btn-filter" data-f="matrix">Matrix</button>
            <button class="btn-filter" data-f="bw">Monochrome</button>
            <button class="btn-filter" data-f="sepia">Sepia FX</button>
            <button class="btn-filter" data-f="invert">Invert</button>
            <button class="btn-filter" data-f="sunset">Warm</button>
            <button class="btn-filter" data-f="ice">Ice Cool</button>
            <button class="btn-filter" data-f="contrast">Contrast</button>
            <button class="btn-filter" data-f="glitch">Glitch FX</button>
        </div>

        <div class="modal-actions">
            <button class="btn-m btn-m-cancel" id="btn-modal-cancel">Отмена</button>
            <button class="btn-m btn-m-apply" id="btn-modal-apply">Отправить в чат</button>
        </div>
    </div>
</div>

        function renderMessages() {
            chatMessages.innerHTML = '';
            const list = histories[activeBotId] || [];

            list.forEach(m => {
                const group = document.createElement('div');
                group.className = `msg-group ${m.type}`;

                let html = formatMarkdown(m.text);

                if (m.mediaType === 'video' && m.mediaUrl) {
                    html += `<video src="${m.mediaUrl}" class="media-preview-video" controls autoplay loop playsinline></video>`;
                } else if (m.mediaType === 'audio' && m.mediaUrl) {
                    html += `<audio src="${m.mediaUrl}" controls style="margin-top:8px; width:100%"></audio>`;
                } else if (m.mediaUrl) {
                    html += `<img src="${m.mediaUrl}" class="media-preview-img" onclick="window.open('${m.mediaUrl}', '_blank')">`;
                }

                if (m.dlUrl) {
                    html += `<br><a href="${m.dlUrl}" target="_blank" download="downloaded_media" class="btn-download">⬇️ Скачать файл</a>`;
                }

                if (m.buttons && m.buttons.length > 0) {
                    html += `<div class="quick-actions">`;
                    m.buttons.forEach(btnText => {
                        html += `<button class="btn-action" onclick="clickActionBtn('${escapeHtml(btnText)}')">${escapeHtml(btnText)}</button>`;
                    });
                    html += `</div>`;
                }

                group.innerHTML = `
                    <div class="msg-bubble">

                        <span class="msg-time">${m.time}</span>
                    </div>
                `;
                chatMessages.appendChild(group);
            });

        function formatMarkdown(txt) {
            if (!txt) return '';
            let s = escapeHtml(txt);
            s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/`(.*?)`/g, '<code style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px">$1</code>');
            s = s.replace(/\n/g, '<br>');
            return s;

                    };
                }
            } catch(e) {}
            return null;

                const res = await fetch(proxyUrl);
                if (res.ok) {

                    // Match Video or HD Image

                    const iMatch = html.match(/https:\/\/i\.pinimg\.com\/[^\s"']+\.(jpg|png|webp)/i);

                    if (vMatch) {

                    } else if (iMatch) {

                    }

            };

            for (let inst of instances) {
                try {
                    const res = await fetch(inst);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.formatStreams && data.formatStreams.length > 0) {
                            const stream = data.formatStreams[0];
                            return {
                                title: data.title || 'YouTube Video',
                                videoUrl: stream.url,
                                author: data.author
                            };
                        }
                    }
                } catch(e) {}
            }

            return {
                title: 'YouTube Stream',
                videoUrl: `https://www.youtube.com/embed/${videoId}`,
                isEmbed: true
            };
        }

        // -------------------------------------------------------------
        // PHOTO FX CANVAS MODAL LOGIC
        // -------------------------------------------------------------
        function openModalEditor(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    loadedImgObj = img;
                    renderCanvasFX('cyber');
                    modalEditor.classList.add('open');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCanvasFX(filterType) {
            if (!loadedImgObj) return;
            const ctx = canvasPreview.getContext('2d');
            canvasPreview.width = loadedImgObj.width;
            canvasPreview.height = loadedImgObj.height;

            ctx.drawImage(loadedImgObj, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvasPreview.width, canvasPreview.height);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
                let r = d[i], g = d[i+1], b = d[i+2];

                if (filterType === 'cyber') {
                    d[i] = Math.min(255, r * 1.3 + 30);
                    d[i+1] = Math.max(0, g * 0.5);
                    d[i+2] = Math.min(255, b * 1.6 + 50);
                } else if (filterType === 'matrix') {
                    d[i] = Math.max(0, r * 0.3);
                    d[i+1] = Math.min(255, g * 1.5 + 40);
                    d[i+2] = Math.max(0, b * 0.3);
                } else if (filterType === 'bw') {
                    let avg = (r + g + b) / 3;
                    d[i] = avg; d[i+1] = avg; d[i+2] = avg;
                } else if (filterType === 'sepia') {
                    d[i] = Math.min(255, (r * 0.393) + (g * 0.769) + (b * 0.189));
                    d[i+1] = Math.min(255, (r * 0.349) + (g * 0.686) + (b * 0.168));
                    d[i+2] = Math.min(255, (r * 0.272) + (g * 0.534) + (b * 0.131));
                } else if (filterType === 'invert') {
                    d[i] = 255 - r; d[i+1] = 255 - g; d[i+2] = 255 - b;
                } else if (filterType === 'sunset') {
                    d[i] = Math.min(255, r + 50);
                    d[i+1] = Math.min(255, g + 20);
                    d[i+2] = Math.max(0, b - 30);
                } else if (filterType === 'ice') {
                    d[i] = Math.max(0, r - 30);
                    d[i+1] = Math.min(255, g + 20);
                    d[i+2] = Math.min(255, b + 60);
                } else if (filterType === 'contrast') {
                    d[i] = r > 128 ? Math.min(255, r * 1.25) : Math.max(0, r * 0.75);
                    d[i+1] = g > 128 ? Math.min(255, g * 1.25) : Math.max(0, g * 0.75);
                    d[i+2] = b > 128 ? Math.min(255, b * 1.25) : Math.max(0, b * 0.75);
                } else if (filterType === 'glitch') {
                    d[i] = (i % 8 === 0) ? 255 : r;
                    d[i+1] = g;
                    d[i+2] = (i % 16 === 0) ? 255 : b;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        filterButtons.onclick = (e) => {
            if (e.target.tagName === 'BUTTON') {
                document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                selectedFilter = e.target.getAttribute('data-f');
                renderCanvasFX(selectedFilter);
            }
        };

        btnModalCancel.onclick = () => {
            modalEditor.classList.remove('open');
        };

        btnModalApply.onclick = () => {
            const outUrl = canvasPreview.toDataURL('image/png');
            modalEditor.classList.remove('open');

            pushMessage('photofx', 'out', `📷 Мое фото из галереи [Эффект: ${selectedFilter}]`, outUrl);

            showTyping('Photo FX Editor');
            setTimeout(() => {
                hideTyping();
                pushMessage('photofx', 'in', `✨ **Фото успешно обработано!**\nПрименен эффект: \`${selectedFilter.toUpperCase()}\``, outUrl, ['📷 Выбрать еще фото 📎'], outUrl);
            }, 700);
        };

        // Render initial list
        renderBotList();
    });
