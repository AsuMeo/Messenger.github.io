<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MAX Telegram Ultra Dark 2026 — Realtime & Law AI</title>

  <!-- Google Fonts & FontAwesome 6 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* TELEGRAM 2026 ULTRA OLED / MODERN DARK THEME */
    :root {
      --bg-app: #0e1217;
      --bg-sidebar: #151d24;
      --bg-header: rgba(21, 29, 36, 0.95);
      --bg-input: #1c2733;
      --bg-bubble-in: #18222d;
      --bg-bubble-out: #2a619e;
      --accent: #5288c1;
      --accent-bright: #64b5f6;
      --text-main: #f5f7fa;
      --text-muted: #708499;
      --border-color: rgba(255, 255, 255, 0.07);
      --law-badge-color: #4fae4e;
      --law-badge-warn: #e5a93c;
      --law-badge-danger: #ef5350;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      height: 100%;
      height: 100dvh;
      width: 100%;
      background-color: var(--bg-app);
      color: var(--text-main);
      overflow: hidden;
      position: fixed;
    }

    /* AUTH UI - TELEGRAM ULTRA OLED STYLE */
    #auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      width: 100vw;
      background: radial-gradient(circle at center, #172330 0%, #090c10 100%);
      padding: 20px;
      position: absolute;
      top: 0; left: 0; z-index: 999;
    }

    .auth-card {
      background: rgba(21, 29, 36, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 32px 28px;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .auth-logo {
      font-size: 42px;
      color: var(--accent-bright);
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(100, 181, 246, 0.4);
    }

    .auth-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .input-field {
      margin-bottom: 14px;
      text-align: left;
    }

    .input-field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-field input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d131a;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
      user-select: text;
    }

    .input-field input:focus {
      border-color: var(--accent-bright);
      box-shadow: 0 0 12px rgba(100, 181, 246, 0.2);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2b6299, #5288c1);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(42, 97, 158, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .auth-switch {
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-switch span {
      color: var(--accent-bright);
      font-weight: 600;
    }

    /* APP LAYOUT FOR MOBILE AND DESKTOP */
    #app-screen {
      display: none;
      height: 100dvh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      flex-direction: row;
    }

    /* SIDEBAR (CHAT LIST) */
    .sidebar {
      width: 360px;
      height: 100dvh;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .sidebar-header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
    }

    .user-avatar-btn {
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, #2b5278, #5288c1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .search-bar {
      position: relative;
      flex: 1;
    }

    .search-bar i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.05);
      background: #0f1720;
      color: #fff;
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      transition: background 0.15s;
    }

    .chat-item:active, .chat-item.active {
      background: rgba(43, 82, 120, 0.3);
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-username {
      font-size: 12px;
      color: var(--accent-bright);
    }

    .chat-preview {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CHAT AREA */
    .chat-main {
      flex: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #090e13;
      position: relative;
      overflow: hidden;
    }

    /* TELEGRAM CHAT HEADER */
    .chat-header {
      height: 60px;
      padding: 0 16px;
      background: var(--bg-header);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
      flex-shrink: 0;
    }

    .btn-back {
      display: none;
      background: none;
      border: none;
      color: var(--accent-bright);
      font-size: 20px;
      padding: 8px;
      cursor: pointer;
    }

    .chat-header-details {
      flex: 1;
      min-width: 0;
    }

    .chat-header-title {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-subtitle {
      font-size: 12px;
      color: var(--accent-bright);
    }

    /* MESSAGES VIEWPORT */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* BUBBLE STYLING - EXACT MATCH TO USER'S SCREENSHOT CONCEPT */
    .msg-bubble {
      max-width: 88%;
      padding: 10px 14px;
      border-radius: 18px;
      position: relative;
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      user-select: text;
    }

    .msg-in {
      align-self: flex-start;
      background: var(--bg-bubble-in);
      color: #f0f4f8;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .msg-out {
      align-self: flex-end;
      background: var(--bg-bubble-out);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    /* FOOTER INSIDE BUBBLE FOR LAW BADGE & TIME & STATUS */
    .msg-footer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      float: right;
      margin-top: 4px;
      margin-left: 12px;
      line-height: 1;
      vertical-align: bottom;
    }

    .law-badge {
      font-weight: 600;
      font-size: 11px;
      color: var(--law-badge-color);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(79, 174, 78, 0.18);
      border: 1px solid rgba(79, 174, 78, 0.3);
    }

    .law-badge.warn {
      color: var(--law-badge-warn);
      background: rgba(229, 169, 60, 0.18);
      border-color: rgba(229, 169, 60, 0.3);
    }

    .law-badge.danger {
      color: var(--law-badge-danger);
      background: rgba(239, 83, 80, 0.18);
      border-color: rgba(239, 83, 80, 0.3);
    }

    .msg-time {
      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;
    }

    .msg-check {
      color: #52b052;
      font-size: 12px;
    }

    /* MOBILE-OPTIMIZED ALWAYS VISIBLE INPUT BAR AT BOTTOM */
    .input-bar {
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 30;
      flex-shrink: 0;
      width: 100%;
    }

    .btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .btn-icon:active {
      background: rgba(255,255,255,0.08);
      color: var(--accent-bright);
    }

    .input-box {
      flex: 1;
      background: var(--bg-input);
      border-radius: 22px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      padding: 6px 0;
      user-select: text;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b6299, #5288c1);
      border: none;
      color: #fff;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(42, 97, 158, 0.4);
      transition: transform 0.1s;
    }

    .btn-send:active {
      transform: scale(0.92);
    }

    /* MODAL WINDOWS FOR PROFILE / AVATAR SELECT */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-sidebar);
      padding: 28px 24px;
      border-radius: 20px;
      width: 100%;
      max-width: 350px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .modal-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin: 16px auto;
      background: linear-gradient(135deg, #2b5278, #5288c1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .hidden-file {
      display: none;
    }

    /* RESPONSIVE MOBILE ADAPTABILITY */
    @media (max-width: 768px) {
      .sidebar {
        width: 100vw;
        position: absolute;
        top: 0; left: 0; bottom: 0;
      }

      .sidebar.hidden {
        transform: translateX(-100%);
      }

      .chat-main {
        width: 100vw;
      }

      .btn-back {
        display: block;
      }
    }

    /* EMPTY CHAT PLACEHOLDER */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 30px;
    }

    .empty-state i {
      font-size: 54px;
      color: var(--accent-bright);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- AUTHENTICATION SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo"><i class="fa-solid fa-paper-plane"></i></div>
      <h2 id="auth-title">Вход в MAX</h2>
      <p id="auth-subtitle">Мессенджер с ИИ и анализом законов</p>

      <div class="input-field" id="field-username" style="display: none;">
        <label>Уникальный @username</label>
        <input type="text" id="auth-username" placeholder="@alex_2026" autocomplete="off" />
      </div>

      <div class="input-field">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="mail@example.com" autocomplete="off" />
      </div>

      <div class="input-field">
        <label>Пароль</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>

      <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Войти</button>

      <div class="auth-switch" onclick="toggleAuthMode()">
        <span id="auth-switch-text">Нет аккаунта? Зарегистрироваться</span>
      </div>
    </div>
  </div>

  <!-- MAIN MESSENGER SCREEN -->
  <div id="app-screen">
    <!-- SIDEBAR / CHATS LIST -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-avatar-btn" onclick="openProfileModal()">
          <div class="avatar-img" id="my-avatar-display">M</div>
        </div>
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Поиск по @username..." oninput="handleSearch(this.value)" />
        </div>
      </div>

      <div class="chat-list" id="chat-list">
        <!-- Chats will render dynamically -->
      </div>
    </div>

    <!-- MAIN CHAT VIEW -->
    <div class="chat-main" id="chat-main">
      <div class="chat-header" id="chat-header" style="display: none;">
        <button class="btn-back" onclick="closeChatMobile()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="avatar-img" id="chat-header-avatar" style="width: 40px; height: 40px; font-size: 16px;">?</div>
        <div class="chat-header-details">
          <div class="chat-header-title" id="chat-header-title">Выберите диалог</div>
          <div class="chat-header-subtitle" id="chat-header-subtitle">в сети</div>
        </div>
      </div>

      <!-- MESSAGES VIEWPORT -->
      <div class="messages-viewport" id="messages-viewport">
        <div class="empty-state" id="empty-state">
          <i class="fa-solid fa-comments"></i>
          <h3>Выберите чат или нажмите на ИИ</h3>
          <p style="font-size: 13px; margin-top: 8px;">Все сообщения анализируются в реальном времени с выводом статьи законов РФ!</p>
        </div>
      </div>

      <!-- MOBILE-OPTIMIZED ALWAYS VISIBLE INPUT BAR -->
      <div class="input-bar" id="input-bar" style="display: none;">
        <button class="btn-icon" onclick="triggerGalleryPick()" title="Галерея / Google Фото"><i class="fa-solid fa-paperclip"></i></button>
        <div class="input-box">
          <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" />
        </div>
        <button class="btn-send" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- PROFILE & GALLERY AVATAR MODAL -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <h3 style="color:#fff;">Профиль</h3>
      <div class="modal-avatar" id="modal-avatar">?</div>
      
      <button class="btn-primary" style="margin-bottom: 12px; background: #1c2733; box-shadow: none;" onclick="document.getElementById('avatar-input').click()">
        <i class="fa-solid fa-image"></i> Изменить аватар (Галерея / Google Фото)
      </button>
      <input type="file" id="avatar-input" class="hidden-file" accept="image/*" onchange="uploadAvatar(event)" />

      <div class="input-field">
        <label>Юзернейм</label>
        <input type="text" id="profile-username" readonly style="opacity: 0.7;" />
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn-primary" style="background: #ef5350; box-shadow: none;" onclick="logout()">Выйти</button>
        <button class="btn-primary" style="background: #2b5278; box-shadow: none;" onclick="closeProfileModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // FIREBASE REALTIME CONFIG
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",

      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let currentUserProfile = null;
    let activeChatUser = null;
    let isRegister = false;
    let messagesListener = null;

    // REAL WORKING AI BOT OBJECT
    const AI_BOT = {
      uid: "ai_bot_system_2026",
      username: "@ai_bot",
      displayName: "ИИ Юрист-Консультант",
      photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
      isAI: true
    };

    // -------------------------------------------------------------
    // REALTIME LEGAL RISK EVALUATOR (EXACTLY AS SCREENSHOT)
    // -------------------------------------------------------------
    function getLawAnalysis(text) {
      if (!text) return { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" };
      const lower = text.toLowerCase();

      if (lower.includes("бомб") || lower.includes("теракт") || lower.includes("взрыв") || lower.includes("заминиро")) {
        return { badge: "УК РФ 207.1", text: "Срок от 3 до 5 лет", type: "danger" };
      }
      if (lower.includes("мах") || lower.includes("макс") || lower.includes("сесть") || lower.includes("сообщени") || lower.includes("добавить")) {
        return { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" };
      }
      if (lower.includes("убью") || lower.includes("расправ") || lower.includes("угроза")) {
        return { badge: "УК РФ 119", text: "Срок до 2 лет", type: "danger" };
      }
      if (lower.includes("дурак") || lower.includes("идиот") || lower.includes("оскорб")) {
        return { badge: "КоАП РФ 5.61", text: "Штраф до 5 000 ₽", type: "warn" };
      }
      if (lower.includes("привет") || lower.includes("как дела") || lower.includes("добрый")) {
        return { badge: "ст. 29 К РФ", text: "Законно ✓", type: "safe" };
      }

      // Default dynamic article mapping
      const defaultArticles = [
        { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" },
        { badge: "УК РФ 128.1", text: "Клевета (Штраф)", type: "warn" },
        { badge: "ст. 29 К РФ", text: "Свобода слова ✓", type: "safe" }
      ];
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash << 5) - hash + text.charCodeAt(i);
      return defaultArticles[Math.abs(hash) % defaultArticles.length];
    }

    // -------------------------------------------------------------
    // AUTH LOGIC
    // -------------------------------------------------------------
    function toggleAuthMode() {
      isRegister = !isRegister;
      document.getElementById("auth-title").innerText = isRegister ? "Регистрация" : "Вход в MAX";
      document.getElementById("field-username").style.display = isRegister ? "block" : "none";
      document.getElementById("auth-btn").innerText = isRegister ? "Создать аккаунт" : "Войти";
      document.getElementById("auth-switch-text").innerText = isRegister ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
    }

    async function handleAuth() {
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value.trim();

      if (!email || !password) return alert("Введите Email и Пароль!");

      try {
        if (isRegister) {
          const usernameVal = document.getElementById("auth-username").value.trim().toLowerCase().replace('@','');
          if (!usernameVal) return alert("Укажите желаемый @username!");

          // Check if username taken
          const snap = await db.ref('usernames/' + usernameVal).once('value');
          if (snap.exists()) return alert("Этот @username уже занят!");

          const res = await auth.createUserWithEmailAndPassword(email, password);
          const uid = res.user.uid;

          const profile = {
            uid: uid,
            email: email,
            username: "@" + usernameVal,
            displayName: usernameVal,
            photoURL: ""
          };

          await db.ref('users/' + uid).set(profile);
          await db.ref('usernames/' + usernameVal).set(uid);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        alert("Ошибка авторизации: " + err.message);
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.reload());
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const snap = await db.ref('users/' + user.uid).once('value');
        currentUserProfile = snap.val() || { username: "@user", displayName: "Пользователь" };

        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("app-screen").style.display = "flex";

        updateMyAvatarUI();
        loadChatList();

        // Auto select AI Chat on mobile/desktop so input box is immediately visible & ready!
        selectChat(AI_BOT);
      } else {
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("app-screen").style.display = "none";
      }
    });

    // -------------------------------------------------------------
    // PROFILE & AVATAR PICKER (GALLERY / GOOGLE PHOTOS)
    // -------------------------------------------------------------
    function openProfileModal() {
      document.getElementById("profile-modal").style.display = "flex";
      document.getElementById("profile-username").value = currentUserProfile.username || "";
      updateModalAvatarUI();
    }

    function closeProfileModal() {
      document.getElementById("profile-modal").style.display = "none";
    }

    function triggerGalleryPick() {
      openProfileModal();
    }

    function updateMyAvatarUI() {
      const el = document.getElementById("my-avatar-display");
      if (currentUserProfile && currentUserProfile.photoURL) {
        el.innerHTML = `<img src="${currentUserProfile.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        el.innerText = (currentUserProfile.displayName || "M")[0].toUpperCase();
      }
    }

    function updateModalAvatarUI() {
      const el = document.getElementById("modal-avatar");
      if (currentUserProfile && currentUserProfile.photoURL) {
        el.innerHTML = `<img src="${currentUserProfile.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        el.innerText = (currentUserProfile.displayName || "M")[0].toUpperCase();
      }
    }

    function uploadAvatar(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64 = evt.target.result;
        currentUserProfile.photoURL = base64;
        db.ref('users/' + currentUser.uid + '/photoURL').set(base64);
        updateMyAvatarUI();
        updateModalAvatarUI();
      };
      reader.readAsDataURL(file);
    }

    // -------------------------------------------------------------
    // CHAT LIST & GLOBAL SEARCH BY @USERNAME
    // -------------------------------------------------------------
    async function handleSearch(query) {
      query = query.trim().toLowerCase().replace('@','');
      const listEl = document.getElementById("chat-list");

      if (!query) {
        loadChatList();
        return;
      }

      const snap = await db.ref('users').once('value');
      const users = snap.val() || {};

      listEl.innerHTML = `<div style="padding:10px 16px;color:var(--text-muted);font-size:12px;">Результаты поиска:</div>`;

      if ("ai_bot".includes(query) || "ии".includes(query) || "юрист".includes(query)) {
        renderChatItem(AI_BOT, "Настоящий ИИ Юрист");
      }

      Object.values(users).forEach(u => {
        if (u.uid !== currentUser.uid && u.username && u.username.toLowerCase().includes(query)) {
          renderChatItem(u, u.username);
        }
      });
    }

    function loadChatList() {
      const listEl = document.getElementById("chat-list");
      listEl.innerHTML = "";

      // Render AI Bot
      renderChatItem(AI_BOT, "Нажмите, чтобы открыть диалог с ИИ");

      // Load user conversations from Realtime DB
      db.ref('user_chats/' + currentUser.uid).on('value', (snap) => {
        const chats = snap.val() || {};
        listEl.innerHTML = "";
        renderChatItem(AI_BOT, "Нажмите, чтобы открыть диалог с ИИ");

        Object.keys(chats).forEach(async (peerUid) => {
          if (peerUid === AI_BOT.uid) return;
          const uSnap = await db.ref('users/' + peerUid).once('value');
          if (uSnap.exists()) {
            renderChatItem(uSnap.val(), chats[peerUid].lastMessage || "Сообщений нет");
          }
        });
      });
    }

    function renderChatItem(userObj, previewText) {
      const listEl = document.getElementById("chat-list");
      const item = document.createElement("div");
      item.className = `chat-item ${activeChatUser && activeChatUser.uid === userObj.uid ? 'active' : ''}`;
      item.onclick = () => selectChat(userObj);

      const avatarHtml = userObj.photoURL 
        ? `<img src="${userObj.photoURL}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">`
        : `<div class="avatar-img">${(userObj.displayName || userObj.username || "?")[0].toUpperCase()}</div>`;

      item.innerHTML = `
        ${avatarHtml}
        <div class="chat-info">
          <div class="chat-top-row">
            <span class="chat-name">${userObj.displayName || userObj.username}</span>
            <span class="chat-username">${userObj.username}</span>
          </div>
          <div class="chat-preview">${previewText}</div>
        </div>
      `;
      listEl.appendChild(item);
    }

    // -------------------------------------------------------------
    // CHAT SELECTION & MOBILE LAYOUT SWITCHING
    // -------------------------------------------------------------
    function selectChat(userObj) {
      activeChatUser = userObj;

      document.getElementById("chat-header").style.display = "flex";
      document.getElementById("input-bar").style.display = "flex";
      document.getElementById("chat-header-title").innerText = userObj.displayName || userObj.username;
      document.getElementById("chat-header-subtitle").innerText = userObj.isAI ? "ИИ в сети" : "онлайн";

      const headerAvatar = document.getElementById("chat-header-avatar");
      if (userObj.photoURL) {
        headerAvatar.innerHTML = `<img src="${userObj.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        headerAvatar.innerText = (userObj.displayName || userObj.username || "?")[0].toUpperCase();
      }

      // Hide sidebar on mobile screens
      document.getElementById("sidebar").classList.add("hidden");

      // Load Realtime Messages
      if (messagesListener) messagesListener.off();

      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const viewport = document.getElementById("messages-viewport");
      viewport.innerHTML = "";

      messagesListener = db.ref('chats/' + chatId + '/messages');
      messagesListener.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        appendMessage(msg);
      });
    }

    function closeChatMobile() {
      document.getElementById("sidebar").classList.remove("hidden");
    }

    function getChatId(u1, u2) {
      return u1 < u2 ? `${u1}_${u2}` : `${u2}_${u1}`;
    }

    // -------------------------------------------------------------
    // RENDER MESSAGE BUBBLE WITH LAWS EXACTLY LIKE PHOTO
    // -------------------------------------------------------------
    function appendMessage(msg) {
      const viewport = document.getElementById("messages-viewport");
      const emptyState = document.getElementById("empty-state");
      if (emptyState) emptyState.style.display = "none";

      const isOut = msg.senderUid === currentUser.uid;
      const bubble = document.createElement("div");
      bubble.className = `msg-bubble ${isOut ? 'msg-out' : 'msg-in'}`;

      const law = getLawAnalysis(msg.text);
      const badgeClass = law.type === 'danger' ? 'danger' : (law.type === 'warn' ? 'warn' : '');

      bubble.innerHTML = `
        <span>${escapeHtml(msg.text)}</span>
        <div class="msg-footer">
          <span class="law-badge ${badgeClass}">${law.badge} ${law.text}</span>
          <span class="msg-time">${msg.time}</span>
          ${isOut ? '<span class="msg-check"><i class="fa-solid fa-check-double"></i></span>' : ''}
        </div>
      `;

      viewport.appendChild(bubble);
      viewport.scrollTop = viewport.scrollHeight;
    }

    // -------------------------------------------------------------
    // SEND MESSAGE & REAL AI INTEGRATION
    // -------------------------------------------------------------
    async function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      input.value = "";
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

      const msgObj = {
        senderUid: currentUser.uid,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        time: timeStr
      };

      await db.ref('chats/' + chatId + '/messages').push(msgObj);

      db.ref(`user_chats/${currentUser.uid}/${activeChatUser.uid}`).set({ lastMessage: text, timestamp: Date.now() });
      if (!activeChatUser.isAI) {
        db.ref(`user_chats/${activeChatUser.uid}/${currentUser.uid}`).set({ lastMessage: text, timestamp: Date.now() });
      }

      // IF CHATTING WITH AI BOT -> TRIGGER REAL AI CALL
      if (activeChatUser.isAI) {
        triggerAIResponse(text, chatId);
      }
    }

    async function triggerAIResponse(query, chatId) {
      try {
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Ты юрист и ИИ помощник мессенджера MAX. Ответь кратко на русском языке: " + query)}`);
        const replyText = await response.text();

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

        const aiMsgObj = {
          senderUid: AI_BOT.uid,
          text: replyText || "Запрос успешно принят и обработан ИИ.",
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          time: timeStr
        };

        setTimeout(() => {
          db.ref('chats/' + chatId + '/messages').push(aiMsgObj);
        }, 500);
      } catch (e) {
        console.error("AI Fetch Error:", e);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
