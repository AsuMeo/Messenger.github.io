<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube → VK</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #141414;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid #222;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff4444, #4472ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { color: #888; font-size: 14px; margin-bottom: 24px; }
    .input-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: #4472ff; }
    textarea { resize: none; height: 80px; font-family: monospace; font-size: 12px; }
    button {
      width: 100%;
      background: linear-gradient(135deg, #4472ff, #7c3aed);
      border: none;
      border-radius: 10px;
      padding: 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    .status.loading {
      display: block;
      background: #1a237e;
      color: #82b1ff;
    }
    .status.success {
      display: block;
      background: #1b5e20;
      color: #69f0ae;
    }
    .status.error {
      display: block;
      background: #b71c1c;
      color: #ff8a80;
    }
    .hint {
      margin-top: 20px;
      padding: 12px;
      background: #0a0a0a;
      border-radius: 10px;
      border-left: 3px solid #ff4444;
    }
    .hint h3 { font-size: 13px; color: #ff4444; margin-bottom: 6px; }
    .hint ol { padding-left: 16px; color: #888; font-size: 13px; line-height: 1.8; }
    .hint a { color: #4472ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>YouTube → VK</h1>
    <p>Скачай видео с YouTube и загрузи на свой аккаунт ВК</p>

    <div class="input-group">
      <label>Ссылка на YouTube</label>
      <input type="text" id="url" placeholder="https://youtube.com/watch?v=..." autocomplete="off">
    </div>

    <div class="input-group">
      <label>Токен доступа VK</label>
      <textarea id="token" placeholder="vk1.a.xxx..." spellcheck="false"></textarea>
    </div>

    <button id="btn" onclick="upload()">Загрузить на VK</button>

    <div id="status" class="status"></div>

    <div class="hint">
      <h3>Как получить токен VK:</h3>
      <ol>
        <li>Открой: <a href="https://vkhost.github.io/" target="_blank">vkhost.github.io</a></li>
        <li>Выбери "VK Admin" или "Kate Mobile"</li>
        <li>Нажми "Получить", разреши доступ</li>
        <li>Скопируй токен из адресной строки (после <code>#access_token=</code>)</li>
        <li>Вставь сюда 👆</li>
      </ol>
    </div>
  </div>

  <script>
    async function upload() {
      const url = document.getElementById('url').value.trim();
      const token = document.getElementById('token').value.trim();
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');

      if (!url || !token) {
        showStatus('error', 'Заполни все поля');
        return;
      }

      btn.disabled = true;
      showStatus('loading', 'Скачиваю видео... Это может занять минуту');

      try {
        const res = await fetch('/api/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ youtubeUrl: url, vkToken: token })
        });

        const data = await res.json();

        if (data.success) {
          showStatus('success', `✅ ${data.message}\n\n<a href="${data.vkUrl}" target="_blank" style="color:#69f0ae">Открыть видео в VK</a>`);
        } else {
          showStatus('error', data.error || 'Ошибка');
        }
      } catch (err) {
        showStatus('error', 'Ошибка сети: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    function showStatus(type, text) {
      const el = document.getElementById('status');
      el.className = 'status ' + type;
      el.innerHTML = text;
    }
  </script>
</body>
</html>
