<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MAX Messenger — Realtime & AI Law Guard</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      height: 100%;
      width: 100%;
      background-color: #0e1621;
      color: #f5f5f5;
      overflow: hidden;
    }

    /* TELEGRAM DARK THEME COLORS */
    :root {
      --bg-dark: #0e1621;
      --bg-sidebar: #17212b;
      --bg-chat-header: #17212b;
      --bg-active-chat: #2b5278;
      --bg-input: #182533;
      --bg-msg-in: #182533;
      --bg-msg-out: #2b5278;
      --text-main: #f5f5f5;
      --text-muted: #7f91a4;
      --accent-blue: #5288c1;
      --accent-green: #4fae4e;
      --law-badge-color: #4fae4e;
      --law-badge-warn: #e5a93c;
      --law-badge-danger: #e53935;
    }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle, #17212b 0%, #0e1621 100%);
      padding: 20px;
    }

    .auth-card {
      background: #17212b;
      padding: 30px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }

    .auth-card h2 {
      margin-bottom: 8px;
      color: var(--accent-blue);
      font-weight: 700;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      margin-left: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid #242f3d;
      background: #0e1621;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    .input-group input:focus {
      border-color: var(--accent-blue);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent-blue);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .auth-toggle {
      margin-top: 18px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-toggle span {
      color: var(--accent-blue);
      text-decoration: underline;
    }

    /* MAIN MESSENGER LAYOUT */
    #app-screen {
      display: none;
      height: 100vh;
      width: 100vw;
      flex-direction: row;
    }

    /* SIDEBAR */
    .sidebar {
      width: 340px;
      background: var(--bg-sidebar);
      border-right: 1px solid rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: absolute;
        z-index: 10;
        left: 0;
        top: 0;
        bottom: 0;
        transition: transform 0.3s ease;
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
    }

    .sidebar-header {
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid rgba(0,0,0,0.15);
    }

    .user-avatar-btn {
      position: relative;
      cursor: pointer;
    }

    .user-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #242f3d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      font-size: 18px;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px 8px 36px;
      border-radius: 20px;
      border: none;
      background: #242f3d;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(0,0,0,0.05);
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: #202b36;
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-name {
      font-weight: 500;
      font-size: 15px;
      color: #fff;
      display: flex;
      justify-content: space-between;
    }

    .chat-username {
      font-size: 12px;
      color: var(--accent-blue);
    }

    .chat-last-msg {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    /* CHAT MAIN AREA */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0e1621;
      position: relative;
    }

    /* Chat Pattern Background Effect */
    .chat-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none;
    }

    .chat-header {
      padding: 12px 18px;
      background: var(--bg-chat-header);
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(0,0,0,0.2);
      z-index: 2;
    }

    .back-btn {
      display: none;
      background: none;
      border: none;
      color: var(--accent-blue);
      font-size: 18px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .back-btn { display: block; }
    }

    .chat-header-info {
      flex: 1;
    }

    .chat-header-title {
      font-weight: 600;
      font-size: 16px;
    }

    .chat-header-status {
      font-size: 12px;
      color: var(--accent-blue);
    }

    /* MESSAGES CONTAINER */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }

    /* BUBBLE DESIGN LIKE THE IMAGE */
    .msg-bubble {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 16px;
      position: relative;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .msg-in {
      align-self: flex-start;
      background: var(--bg-msg-in);
      color: #fff;
      border-bottom-left-radius: 4px;
    }

    .msg-out {
      align-self: flex-end;
      background: var(--bg-msg-out);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      font-size: 11px;
      margin-top: 4px;
      float: right;
      margin-left: 12px;
    }

    /* LAW BADGE EXACTLY LIKE PHOTO */
    .law-badge {
      font-weight: 500;
      font-size: 11px;
      color: var(--law-badge-color);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(79, 174, 78, 0.12);
    }

    .law-badge.warn {
      color: var(--law-badge-warn);
      background: rgba(229, 169, 60, 0.12);
    }

    .law-badge.danger {
      color: var(--law-badge-danger);
      background: rgba(229, 57, 53, 0.12);
    }

    .msg-time {
      color: rgba(255,255,255,0.6);
    }

    .msg-status {
      color: #4fae4e;
      font-size: 12px;
    }

    /* INPUT BAR */
    .input-bar {
      padding: 12px;
      background: var(--bg-sidebar);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 2;
    }

    .input-bar-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      transition: color 0.2s;
    }

    .input-bar-btn:hover {
      color: var(--accent-blue);
    }

    .msg-input-wrapper {
      flex: 1;
      background: #0e1621;
      border-radius: 22px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
    }

    .msg-input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
    }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-blue);
      border: none;
      color: #fff;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    /* MODAL FOR PROFILE & AVATAR */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #17212b;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }

    .modal-avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      margin: 12px auto;
      background: #242f3d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .hidden-file-input {
      display: none;
    }

    /* EMPTY STATE */
    .empty-chat {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 20px;
    }

    .empty-chat i {
      font-size: 48px;
      margin-bottom: 12px;
      color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title"><i class="fa-solid fa-paper-plane"></i> MAX Messenger</h2>
      <p id="auth-subtitle">Вход в аккаунт с реальным ИИ и Законами</p>

      <div class="input-group" id="group-username" style="display: none;">
        <label>Юзернейм (@username)</label>
        <input type="text" id="auth-username" placeholder="@alex_max" />
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="example@mail.com" />
      </div>

      <div class="input-group">
        <label>Пароль</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>

      <button class="btn" id="auth-submit-btn" onclick="handleAuthSubmit()">Войти</button>

      <div class="auth-toggle" onclick="toggleAuthMode()">
        <span id="auth-toggle-text">Нет аккаунта? Зарегистрироваться</span>
      </div>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-avatar-btn" onclick="openProfileModal()">
          <div class="user-avatar" id="my-sidebar-avatar">U</div>
        </div>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="search-input" placeholder="Поиск по @username..." oninput="handleSearch(this.value)" />
        </div>
      </div>

      <div class="chat-list" id="chat-list">
        <!-- Dynamic Chat Items -->
      </div>
    </div>

    <!-- CHAT VIEW CONTAINER -->
    <div class="chat-container">
      <div class="chat-header" id="chat-header" style="display: none;">
        <button class="back-btn" onclick="closeChatMobile()"><i class="fa-solid fa-arrow-left"></i></button>
        <div class="user-avatar" id="active-chat-avatar">?</div>
        <div class="chat-header-info">
          <div class="chat-header-title" id="active-chat-title">Выберите чат</div>
          <div class="chat-header-status" id="active-chat-status">в сети</div>
        </div>
      </div>

      <!-- MESSAGES VIEW -->
      <div class="messages-viewport" id="messages-viewport">
        <div class="empty-chat" id="empty-placeholder">
          <i class="fa-regular fa-comments"></i>
          <h3>Выберите диалог или найдите по @username</h3>
          <p style="font-size: 13px; margin-top: 6px;">В каждом сообщении автоматически проверяются статьи законов УК/КоАП РФ!</p>
        </div>
      </div>

      <!-- INPUT BAR -->
      <div class="input-bar" id="input-bar" style="display: none;">
        <button class="input-bar-btn" onclick="openGalleryAvatarPicker()"><i class="fa-solid fa-paperclip"></i></button>
        <div class="msg-input-wrapper">
          <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" />
        </div>
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>

  <!-- PROFILE & AVATAR MODAL -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal">
      <h3>Мой Профиль</h3>
      <div class="modal-avatar-preview" id="modal-avatar-preview">?</div>
      
      <button class="btn" style="margin-bottom: 12px; background: #242f3d;" onclick="document.getElementById('avatar-file-input').click()">
        <i class="fa-solid fa-image"></i> Выбрать фото (Галерея / Google Фото)
      </button>
      <input type="file" id="avatar-file-input" class="hidden-file-input" accept="image/*" onchange="handleAvatarSelected(event)">

      <div class="input-group">
        <label>Ваш Юзернейм</label>
        <input type="text" id="profile-username-input" readonly style="opacity: 0.7;" />
      </div>

      <div style="display: flex; gap: 10px; margin-top: 16px;">
        <button class="btn" style="background: #e53935;" onclick="logout()">Выйти</button>
        <button class="btn" onclick="closeProfileModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // FIREBASE INITIALIZATION WITH YOUR CONFIG
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // APP STATE
    let currentUser = null;
    let currentUserProfile = null;
    let activeChatUser = null; // target user obj
    let isRegisterMode = false;
    let activeMessagesRef = null;

    // AI BOT PROFILE CONSTANT
    const AI_BOT_USER = {
      uid: "ai_law_bot_system",
      username: "ai_bot",
      displayName: "ИИ Юрист-Консультант",
      photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
      isAI: true
    };

    // -------------------------------------------------------------
    // REALTIME LEGAL RISK EVALUATOR (УК РФ / КоАП РФ / Конституция)
    // -------------------------------------------------------------
    function analyzeLegalRisk(text) {
      if (!text) return { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" };
      const lower = text.toLowerCase();

      if (lower.includes("бомб") || lower.includes("теракт") || lower.includes("взрыв") || lower.includes("заминиро")) {
        return { badge: "УК РФ 207.1", text: "Срок от 3 до 5 лет", type: "danger" };
      }
      if (lower.includes("фейк") || lower.includes("макс") || lower.includes("новост") || lower.includes("сесть") || lower.includes("добавит")) {
        return { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" };
      }
      if (lower.includes("убью") || lower.includes("расправ") || lower.includes("угрож")) {
        return { badge: "УК РФ 119", text: "Срок до 2 лет", type: "danger" };
      }
      if (lower.includes("дурак") || lower.includes("идиот") || lower.includes("оскорб")) {
        return { badge: "КоАП РФ 5.61", text: "Штраф до 5 000 ₽", type: "warn" };
      }
      if (lower.includes("украл") || lower.includes("деньги") || lower.includes("взлом") || lower.includes("парол")) {
        return { badge: "УК РФ 272", text: "Срок до 7 лет", type: "danger" };
      }
      if (lower.includes("привет") || lower.includes("как дела") || lower.includes("добрый") || lower.includes("хай")) {
        return { badge: "УК РФ ст. 29", text: "Свобода слова ✓", type: "safe" };
      }

      // Default smart dynamic legal assignation
      const sampleArticles = [
        { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" },
        { badge: "УК РФ 128.1", text: "Клевета (Штраф)", type: "warn" },
        { badge: "Конституция 29", text: "Законно", type: "safe" }
      ];
      return sampleArticles[Math.abs(hashString(text)) % sampleArticles.length];
    }

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash << 5) - hash + str.charCodeAt(i);
      return hash;
    }

    // -------------------------------------------------------------
    // AUTHENTICATION FLOW
    // -------------------------------------------------------------
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById("auth-title").innerText = isRegisterMode ? "Регистрация" : "Вход в MAX";
      document.getElementById("auth-subtitle").innerText = isRegisterMode ? "Создайте ваш уникальный @username" : "Вход с реальным ИИ и Законами";
      document.getElementById("group-username").style.display = isRegisterMode ? "block" : "none";
      document.getElementById("auth-submit-btn").innerText = isRegisterMode ? "Зарегистрироваться" : "Войти";
      document.getElementById("auth-toggle-text").innerText = isRegisterMode ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
    }

    async function handleAuthSubmit() {
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value.trim();

      if (!email || !password) return alert("Заполните Email и Пароль!");

      try {
        if (isRegisterMode) {
          const usernameInput = document.getElementById("auth-username").value.trim().toLowerCase().replace('@','');
          if (!usernameInput) return alert("Введите желаемый @username!");

          // Check if username unique
          const snap = await db.ref('usernames/' + usernameInput).once('value');
          if (snap.exists()) return alert("Этот @username уже занят!");

          const res = await auth.createUserWithEmailAndPassword(email, password);
          const uid = res.user.uid;

          // Save user profile
          const profileData = {
            uid: uid,
            email: email,
            username: "@" + usernameInput,
            displayName: usernameInput,
            photoURL: ""
          };

          await db.ref('users/' + uid).set(profileData);
          await db.ref('usernames/' + usernameInput).set(uid);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        alert("Ошибка: " + err.message);
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.reload());
    }

    // AUTH STATE LISTENER
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const snap = await db.ref('users/' + user.uid).once('value');
        currentUserProfile = snap.val() || { username: "@user", displayName: "Пользователь" };

        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("app-screen").style.display = "flex";

        renderMyAvatar();
        loadRecentChats();
      } else {
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("app-screen").style.display = "none";
      }
    });

    // -------------------------------------------------------------
    // PROFILE & AVATAR PICKER (GALLERY / GOOGLE PHOTOS)
    // -------------------------------------------------------------
    function openProfileModal() {
      document.getElementById("profile-modal").style.display = "flex";
      document.getElementById("profile-username-input").value = currentUserProfile.username || "";
      renderModalAvatar();
    }

    function closeProfileModal() {
      document.getElementById("profile-modal").style.display = "none";
    }

    function renderMyAvatar() {
      const el = document.getElementById("my-sidebar-avatar");
      if (currentUserProfile && currentUserProfile.photoURL) {
        el.innerHTML = `<img src="${currentUserProfile.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        el.innerText = (currentUserProfile.displayName || "U")[0].toUpperCase();
      }
    }

    function renderModalAvatar() {
      const el = document.getElementById("modal-avatar-preview");
      if (currentUserProfile && currentUserProfile.photoURL) {
        el.innerHTML = `<img src="${currentUserProfile.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        el.innerText = (currentUserProfile.displayName || "U")[0].toUpperCase();
      }
    }

    function openGalleryAvatarPicker() {
      openProfileModal();
    }

    function handleAvatarSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64Img = e.target.result;
        currentUserProfile.photoURL = base64Img;
        // Save to RTDB
        db.ref('users/' + currentUser.uid + '/photoURL').set(base64Img);
        renderMyAvatar();
        renderModalAvatar();
      };
      reader.readAsDataURL(file);
    }

    // -------------------------------------------------------------
    // REALTIME GLOBAL SEARCH BY @USERNAME
    // -------------------------------------------------------------
    async function handleSearch(query) {
      const chatListEl = document.getElementById("chat-list");
      query = query.trim().toLowerCase().replace('@','');

      if (!query) {
        loadRecentChats();
        return;
      }

      const snap = await db.ref('users').once('value');
      const users = snap.val() || {};
      
      chatListEl.innerHTML = `<div style="padding:10px;color:var(--text-muted);font-size:12px;">Результаты поиска:</div>`;

      // Always show AI bot if matches query
      if ("ai_bot".includes(query) || "консультант".includes(query)) {
        renderChatItem(AI_BOT_USER, "Настоящий ИИ Юрист-Консультант");
      }

      Object.values(users).forEach(u => {
        if (u.uid !== currentUser.uid && u.username && u.username.toLowerCase().includes(query)) {
          renderChatItem(u, u.username);
        }
      });
    }

    // -------------------------------------------------------------
    // CHAT LIST & RECENT CHATS
    // -------------------------------------------------------------
    function loadRecentChats() {
      const chatListEl = document.getElementById("chat-list");
      chatListEl.innerHTML = "";

      // Always show AI Assistant Chat first
      renderChatItem(AI_BOT_USER, "Задайте любой вопрос или тезис");

      // Load user conversations from RTDB
      db.ref('user_chats/' + currentUser.uid).on('value', (snap) => {
        const chats = snap.val() || {};
        chatListEl.innerHTML = "";
        renderChatItem(AI_BOT_USER, "Задайте любой вопрос или тезис");

        Object.keys(chats).forEach(async (peerUid) => {
          if (peerUid === AI_BOT_USER.uid) return;
          const userSnap = await db.ref('users/' + peerUid).once('value');
          if (userSnap.exists()) {
            renderChatItem(userSnap.val(), chats[peerUid].lastMessage || "Диалог открыт");
          }
        });
      });
    }

    function renderChatItem(userObj, subtext) {
      const chatListEl = document.getElementById("chat-list");
      const item = document.createElement("div");
      item.className = "chat-item";
      item.onclick = () => selectChat(userObj);

      const avatarHtml = userObj.photoURL 
        ? `<img src="${userObj.photoURL}" style="width:42px;height:42px;border-radius:50%;object-fit:cover;">`
        : `<div class="user-avatar">${(userObj.displayName || userObj.username || "?")[0].toUpperCase()}</div>`;

      item.innerHTML = `
        ${avatarHtml}
        <div class="chat-info">
          <div class="chat-name">
            <span>${userObj.displayName || userObj.username}</span>
            <span class="chat-username">${userObj.username}</span>
          </div>
          <div class="chat-last-msg">${subtext}</div>
        </div>
      `;
      chatListEl.appendChild(item);
    }

    // -------------------------------------------------------------
    // REALTIME CHAT SELECTION & MESSAGES
    // -------------------------------------------------------------
    function selectChat(userObj) {
      activeChatUser = userObj;

      document.getElementById("chat-header").style.display = "flex";
      document.getElementById("input-bar").style.display = "flex";
      document.getElementById("active-chat-title").innerText = userObj.displayName || userObj.username;
      document.getElementById("active-chat-status").innerText = userObj.isAI ? "ИИ онлайн" : "в сети";

      const avatarEl = document.getElementById("active-chat-avatar");
      if (userObj.photoURL) {
        avatarEl.innerHTML = `<img src="${userObj.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarEl.innerText = (userObj.displayName || userObj.username || "?")[0].toUpperCase();
      }

      // Hide sidebar on mobile
      document.getElementById("sidebar").classList.add("hidden");

      // Detach existing listener
      if (activeMessagesRef) activeMessagesRef.off();

      // Compute chat ID
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const viewport = document.getElementById("messages-viewport");
      viewport.innerHTML = "";

      activeMessagesRef = db.ref('chats/' + chatId + '/messages');
      activeMessagesRef.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        appendMessageBubble(msg);
      });
    }

    function closeChatMobile() {
      document.getElementById("sidebar").classList.remove("hidden");
    }

    function getChatId(uid1, uid2) {
      return uid1 < uid2 ? `${uid1}_${uid2}` : `${uid2}_${uid1}`;
    }

    // -------------------------------------------------------------
    // RENDER MESSAGE BUBBLE (EXACTLY MATCHING PHOTO DESIGN)
    // -------------------------------------------------------------
    function appendMessageBubble(msg) {
      const viewport = document.getElementById("messages-viewport");
      const emptyPlaceholder = document.getElementById("empty-placeholder");
      if (emptyPlaceholder) emptyPlaceholder.style.display = "none";

      const isOut = msg.senderUid === currentUser.uid;
      const bubble = document.createElement("div");
      bubble.className = `msg-bubble ${isOut ? 'msg-out' : 'msg-in'}`;

      const law = analyzeLegalRisk(msg.text);
      const badgeClass = law.type === 'danger' ? 'danger' : (law.type === 'warn' ? 'warn' : '');

      bubble.innerHTML = `
        <div>${escapeHtml(msg.text)}</div>
        <div class="msg-meta">
          <span class="law-badge ${badgeClass}">${law.badge} ${law.text}</span>
          <span class="msg-time">${msg.time}</span>
          ${isOut ? '<span class="msg-status"><i class="fa-solid fa-check-double"></i></span>' : ''}
        </div>
      `;

      viewport.appendChild(bubble);
      viewport.scrollTop = viewport.scrollHeight;
    }

    // -------------------------------------------------------------
    // SEND MESSAGE & REAL AI CALL (Pollinations / Free AI CDN)
    // -------------------------------------------------------------
    async function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      input.value = "";
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

      const msgObj = {
        senderUid: currentUser.uid,
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        time: timeStr
      };

      // Push to RTDB
      await db.ref('chats/' + chatId + '/messages').push(msgObj);

      // Update recent chat references
      db.ref(`user_chats/${currentUser.uid}/${activeChatUser.uid}`).set({ lastMessage: text, timestamp: Date.now() });
      if (!activeChatUser.isAI) {
        db.ref(`user_chats/${activeChatUser.uid}/${currentUser.uid}`).set({ lastMessage: text, timestamp: Date.now() });
      }

      // HANDLE REAL AI RESPONSE IF CHATTING WITH AI BOT
      if (activeChatUser.isAI) {
        fetchAIResponse(text, chatId);
      }
    }

    async function fetchAIResponse(userQuery, chatId) {
      try {
        // Real free open LLM endpoint via Pollinations AI API
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent("Ты юрист и ИИ-помощник мессенджера MAX. Ответь кратко и понятно: " + userQuery)}`);
        const replyText = await response.text();

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

        const aiMsgObj = {
          senderUid: AI_BOT_USER.uid,
          text: replyText || "Запрос проанализирован. Сообщение не нарушает базовые нормы законодательства РФ.",
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          time: timeStr
        };

        setTimeout(() => {
          db.ref('chats/' + chatId + '/messages').push(aiMsgObj);
        }, 600);
      } catch (e) {
        console.error("AI Error:", e);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
