<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MAX Telegram OLED Black 2026 — Realtime & AI</title>

  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Firebase v9 Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* TELEGRAM 2026 PURE OLED BLACK THEME (#000000) */
    :root {
      --bg-black: #000000;
      --bg-sidebar: #0f0f10;
      --bg-header: rgba(18, 18, 20, 0.92);
      --bg-card: #161618;
      --bg-input: #1c1c1e;
      --bg-bubble-in: #1c1c1e;
      --bg-bubble-out: #233e5c;
      --accent-blue: #2f80ed;
      --accent-cyan: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --border-color: rgba(255, 255, 255, 0.08);
      --law-badge-color: #4cd964;
      --law-badge-warn: #ffcc00;
      --law-badge-danger: #ff3b30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      height: 100dvh;
      width: 100vw;
      background-color: var(--bg-black);
      color: var(--text-main);
      overflow: hidden;
      position: fixed;
    }

    /* SVG ICON STYLING */
    .icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }

    /* AUTH SCREEN - PURE BLACK OLED STYLING */
    #auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      width: 100vw;
      background: #000000;
      padding: 20px;
      position: absolute;
      top: 0; left: 0; z-index: 999;
    }

    .auth-card {
      background: var(--bg-sidebar);
      padding: 32px 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 40px rgba(0,0,0,0.9);
      text-align: center;
    }

    .auth-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 20px rgba(47, 128, 237, 0.4);
    }

    .auth-card h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
    }

    .auth-card p {
      color: var(--text-muted);
      font-size: 13px;
      margin-bottom: 24px;
    }

    .field-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .field-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .field-group input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      user-select: text;
    }

    .field-group input:focus {
      border-color: var(--accent-blue);
    }

    .btn-main {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #2f80ed, #1c62be);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(47, 128, 237, 0.3);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    .auth-switch {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .auth-switch span {
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* MAIN APP LAYOUT */
    #app-screen {
      display: none;
      height: 100dvh;
      width: 100vw;
      position: relative;
      overflow: hidden;
      flex-direction: row;
      background: var(--bg-black);
    }

    /* SIDEBAR */
    .sidebar {
      width: 360px;
      height: 100dvh;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }

    .sidebar-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
    }

    .user-avatar-btn {
      cursor: pointer;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg, #2f80ed, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      color: #fff;
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      flex: 1;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px;
      height: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 22px;
      border: 1px solid var(--border-color);
      background: var(--bg-input);
      color: #fff;
      font-size: 14px;
      outline: none;
      user-select: text;
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .chat-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      transition: background 0.15s;
    }

    .chat-item:active, .chat-item.active {
      background: #18181a;
    }

    .chat-info {
      flex: 1;
      min-width: 0;
    }

    .chat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-name {
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-username {
      font-size: 12px;
      color: var(--accent-blue);
    }

    .chat-last {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CHAT CONTAINER */
    .chat-main {
      flex: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg-black);
      position: relative;
      overflow: hidden;
    }

    /* CHAT HEADER */
    .chat-header {
      height: 60px;
      padding: 0 16px;
      background: var(--bg-header);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
      flex-shrink: 0;
    }

    .btn-back {
      display: none;
      background: none;
      border: none;
      color: var(--accent-blue);
      cursor: pointer;
      padding: 4px;
    }

    .chat-header-info {
      flex: 1;
      min-width: 0;
    }

    .chat-header-title {
      font-weight: 600;
      font-size: 16px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-header-sub {
      font-size: 12px;
      color: var(--accent-blue);
    }

    /* MESSAGES VIEWPORT */
    .messages-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      -webkit-overflow-scrolling: touch;
      background-color: var(--bg-black);
    }

    /* BUBBLE DESIGN */
    .msg-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      position: relative;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
      user-select: text;
    }

    .msg-in {
      align-self: flex-start;
      background: var(--bg-bubble-in);
      color: #ffffff;
      border-bottom-left-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .msg-out {
      align-self: flex-end;
      background: var(--bg-bubble-out);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-media-img, .msg-media-video {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      margin-bottom: 6px;
      display: block;
      object-fit: cover;
    }

    .msg-footer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      float: right;
      margin-top: 4px;
      margin-left: 10px;
      line-height: 1;
    }

    .law-badge {
      font-weight: 600;
      font-size: 10px;
      color: var(--law-badge-color);
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(76, 217, 100, 0.15);
      border: 1px solid rgba(76, 217, 100, 0.3);
    }

    .law-badge.warn {
      color: var(--law-badge-warn);
      background: rgba(255, 204, 0, 0.15);
      border-color: rgba(255, 204, 0, 0.3);
    }

    .law-badge.danger {
      color: var(--law-badge-danger);
      background: rgba(255, 59, 48, 0.15);
      border-color: rgba(255, 59, 48, 0.3);
    }

    .msg-time {
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
    }

    .msg-check {
      color: #4cd964;
    }

    /* ALWAYS VISIBLE MOBILE INPUT BAR */
    .input-bar {
      padding: 10px 12px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 30;
      flex-shrink: 0;
      width: 100%;
    }

    .btn-icon-svg {
      background: none;
      border: none;
      color: var(--text-muted);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .btn-icon-svg:active {
      color: var(--accent-blue);
      background: rgba(255,255,255,0.05);
    }

    .input-wrapper {
      flex: 1;
      background: var(--bg-input);
      border-radius: 22px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    .input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      padding: 6px 0;
      user-select: text;
    }

    .btn-send-svg {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2f80ed, #1c62be);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(47, 128, 237, 0.4);
      transition: transform 0.1s;
    }

    .btn-send-svg:active {
      transform: scale(0.92);
    }

    /* FULL PROFILE & SETTINGS MODAL */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-sidebar);
      padding: 28px 24px;
      border-radius: 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      max-height: 90dvh;
      overflow-y: auto;
    }

    .modal-avatar-preview {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin: 16px auto;
      background: linear-gradient(135deg, #2f80ed, #00d2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .hidden-file { display: none; }

    /* RESPONSIVE MOBILE ADJUSTMENTS */
    @media (max-width: 768px) {
      .sidebar {
        width: 100vw;
        position: absolute;
        top: 0; left: 0; bottom: 0;
      }

      .sidebar.hidden {
        transform: translateX(-100%);
      }

      .chat-main {
        width: 100vw;
      }

      .btn-back {
        display: block;
      }
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      text-align: center;
      padding: 30px;
    }

    .empty-state svg {
      width: 60px;
      height: 60px;
      color: var(--accent-blue);
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- AUTHENTICATION SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">
        <svg class="icon" viewBox="0 0 24 24" style="width:32px;height:32px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </div>
      <h2 id="auth-title">MAX Telegram</h2>
      <p id="auth-subtitle">Ультра-черная тема OLED • ИИ • Законы</p>

      <div class="field-group" id="group-username" style="display: none;">
        <label>Уникальный @username</label>
        <input type="text" id="auth-username" placeholder="@alex_max" autocomplete="off" />
      </div>

      <div class="field-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="name@domain.com" autocomplete="off" />
      </div>

      <div class="field-group">
        <label>Пароль</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
      </div>

      <button class="btn-main" id="auth-btn" onclick="handleAuthSubmit()">Войти</button>

      <div class="auth-switch" onclick="toggleAuthMode()">
        <span id="auth-switch-text">Нет аккаунта? Зарегистрироваться</span>
      </div>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="user-avatar-btn" onclick="openProfileModal()">
          <div class="avatar-img" id="my-avatar-display">M</div>
        </div>
        <div class="search-box">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="search-input" placeholder="Поиск по @username..." oninput="handleSearch(this.value)" />
        </div>
      </div>

      <div class="chat-list" id="chat-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- MAIN CHAT VIEW -->
    <div class="chat-main">
      <div class="chat-header" id="chat-header" style="display: none;">
        <button class="btn-back" onclick="closeChatMobile()">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="avatar-img" id="chat-header-avatar" style="width: 40px; height: 40px; font-size: 16px;">?</div>
        <div class="chat-header-info">
          <div class="chat-header-title" id="chat-header-title">Диалог</div>
          <div class="chat-header-sub" id="chat-header-sub">в сети</div>
        </div>
      </div>

      <!-- MESSAGES VIEWPORT -->
      <div class="messages-viewport" id="messages-viewport">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <h3>Выберите чат с ИИ или пользователем</h3>
          <p style="font-size: 13px; margin-top: 8px;">Все сообщения анализируются со ссылками на статьи законов РФ!</p>
        </div>
      </div>

      <!-- INPUT BAR FOR MESSAGES / MEDIA ATTACHMENTS -->
      <div class="input-bar" id="input-bar" style="display: none;">
        <button class="btn-icon-svg" onclick="document.getElementById('media-file-input').click()" title="Отправить Фото/Видео из Галереи">
          <svg class="icon" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        </button>
        <input type="file" id="media-file-input" class="hidden-file" accept="image/*,video/*" onchange="handleMediaSelected(event)" />

        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()" />
        </div>
        
        <button class="btn-send-svg" onclick="sendMessage()">
          <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- REALTIME PROFILE & SETTINGS MODAL -->
  <div class="modal-overlay" id="profile-modal">
    <div class="modal-card">
      <h3 style="color:#fff;">Редактировать профиль</h3>
      
      <div class="modal-avatar-preview" id="modal-avatar">?</div>
      
      <button class="btn-main" style="margin-bottom: 16px; background: #1c1c1e; box-shadow: none;" onclick="document.getElementById('avatar-input').click()">
        <svg class="icon" viewBox="0 0 24 24" style="margin-right:6px;"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        Сменить аватар (Галерея / Google Фото)
      </button>
      <input type="file" id="avatar-input" class="hidden-file" accept="image/*" onchange="handleAvatarSelected(event)" />

      <div class="field-group">
        <label>Имя профиля</label>
        <input type="text" id="edit-displayname" placeholder="Ваше Имя" />
      </div>

      <div class="field-group">
        <label>Юзернейм (@username)</label>
        <input type="text" id="edit-username" placeholder="@username" />
      </div>

      <div class="field-group">
        <label>О себе (Био)</label>
        <input type="text" id="edit-bio" placeholder="Напишите пару слов..." />
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn-main" style="background: #2f80ed;" onclick="saveProfileChanges()">Сохранить</button>
        <button class="btn-main" style="background: #ff3b30; box-shadow: none;" onclick="logout()">Выйти</button>
      </div>
      <button class="btn-main" style="margin-top: 10px; background: transparent; border: 1px solid var(--border-color); box-shadow: none;" onclick="closeProfileModal()">Отмена</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // FIREBASE INITIALIZATION WITH YOUR CONFIG
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBm0mIvHVznIeF2PoFk6dtdaiT5r877wyA",
      authDomain: "meow-874ce.firebaseapp.com",
      databaseURL: "https://meow-874ce-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "meow-874ce",
      storageBucket: "meow-874ce.firebasestorage.app",
      messagingSenderId: "471541334599",
      appId: "1:471541334599:web:567af3e7dbe70a37572762"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;
    let currentUserProfile = null;
    let activeChatUser = null;
    let isRegisterMode = false;
    let activeMessagesRef = null;

    // AI BOT SYSTEM USER
    const AI_BOT = {
      uid: "ai_law_bot_system_2026",
      username: "@ai_bot",
      displayName: "ИИ Юрист Консультант",
      photoURL: "https://cdn-icons-png.flaticon.com/512/4712/4712109.png",
      isAI: true
    };

    // -------------------------------------------------------------
    // LAWS ANALYZER (LIKE YOUR PHOTO CONCEPT)
    // -------------------------------------------------------------
    function analyzeLawRisk(text) {
      if (!text) return { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" };
      const lower = text.toLowerCase();

      if (lower.includes("бомб") || lower.includes("теракт") || lower.includes("взрыв") || lower.includes("заминиро")) {
        return { badge: "УК РФ 207.1", text: "Срок от 3 до 5 лет", type: "danger" };
      }
      if (lower.includes("мах") || lower.includes("макс") || lower.includes("сесть") || lower.includes("сообщени") || lower.includes("добавить")) {
        return { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" };
      }
      if (lower.includes("убью") || lower.includes("расправ") || lower.includes("угрожа")) {
        return { badge: "УК РФ 119", text: "Срок до 2 лет", type: "danger" };
      }
      if (lower.includes("оскорб") || lower.includes("дурак") || lower.includes("идиот")) {
        return { badge: "КоАП РФ 5.61", text: "Штраф до 5 000 ₽", type: "warn" };
      }
      if (lower.includes("привет") || lower.includes("как дела") || lower.includes("добрый")) {
        return { badge: "ст. 29 К РФ", text: "Законно ✓", type: "safe" };
      }

      const defaults = [
        { badge: "УК РФ 207.2", text: "Срок от 3 до 5 лет", type: "warn" },
        { badge: "УК РФ 128.1", text: "Клевета (Штраф)", type: "warn" },
        { badge: "ст. 29 К РФ", text: "Свобода слова ✓", type: "safe" }
      ];
      let hash = 0;
      for (let i = 0; i < text.length; i++) hash = (hash << 5) - hash + text.charCodeAt(i);
      return defaults[Math.abs(hash) % defaults.length];
    }

    // -------------------------------------------------------------
    // AUTHENTICATION
    // -------------------------------------------------------------
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById("auth-title").innerText = isRegisterMode ? "Регистрация" : "Вход в MAX";
      document.getElementById("group-username").style.display = isRegisterMode ? "block" : "none";
      document.getElementById("auth-btn").innerText = isRegisterMode ? "Зарегистрироваться" : "Войти";
      document.getElementById("auth-switch-text").innerText = isRegisterMode ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
    }

    async function handleAuthSubmit() {
      const email = document.getElementById("auth-email").value.trim();
      const password = document.getElementById("auth-password").value.trim();

      if (!email || !password) return alert("Введите Email и Пароль!");

      try {
        if (isRegisterMode) {
          const un = document.getElementById("auth-username").value.trim().toLowerCase().replace('@','');
          if (!un) return alert("Введите желаемый @username!");

          const snap = await db.ref('usernames/' + un).once('value');
          if (snap.exists()) return alert("Этот @username уже занят!");

          const res = await auth.createUserWithEmailAndPassword(email, password);
          const uid = res.user.uid;

          const profile = {
            uid: uid,
            email: email,
            username: "@" + un,
            displayName: un,
            bio: "Использую MAX Messenger 2026",
            photoURL: ""
          };

          await db.ref('users/' + uid).set(profile);
          await db.ref('usernames/' + un).set(uid);
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (err) {
        alert("Ошибка: " + err.message);
      }
    }

    function logout() {
      auth.signOut().then(() => window.location.reload());
    }

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        const snap = await db.ref('users/' + user.uid).once('value');
        currentUserProfile = snap.val() || { username: "@user", displayName: "Пользователь" };

        document.getElementById("auth-screen").style.display = "none";
        document.getElementById("app-screen").style.display = "flex";

        renderMyAvatar();
        loadChatList();
        selectChat(AI_BOT); // Default open AI chat so input is immediately ready!
      } else {
        document.getElementById("auth-screen").style.display = "flex";
        document.getElementById("app-screen").style.display = "none";
      }
    });

    // -------------------------------------------------------------
    // PROFILE & EDITING REALTIME
    // -------------------------------------------------------------
    function openProfileModal() {
      document.getElementById("profile-modal").style.display = "flex";
      document.getElementById("edit-displayname").value = currentUserProfile.displayName || "";
      document.getElementById("edit-username").value = (currentUserProfile.username || "").replace('@','');
      document.getElementById("edit-bio").value = currentUserProfile.bio || "";
      renderModalAvatar();
    }

    function closeProfileModal() {
      document.getElementById("profile-modal").style.display = "none";
    }

    function renderMyAvatar() {
      const el = document.getElementById("my-avatar-display");
      if (currentUserProfile && currentUserProfile.photoURL) {
        el.innerHTML = `<img src="${currentUserProfile.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        el.innerText = (currentUserProfile.displayName || "M")[0].toUpperCase();
      }
    }

    function renderModalAvatar() {
      const el = document.getElementById("modal-avatar");
      if (currentUserProfile && currentUserProfile.photoURL) {
        el.innerHTML = `<img src="${currentUserProfile.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        el.innerText = (currentUserProfile.displayName || "M")[0].toUpperCase();
      }
    }

    function handleAvatarSelected(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentUserProfile.photoURL = e.target.result;
        renderModalAvatar();
        renderMyAvatar();
      };
      reader.readAsDataURL(file);
    }

    async function saveProfileChanges() {
      const newName = document.getElementById("edit-displayname").value.trim();
      const newUn = document.getElementById("edit-username").value.trim().toLowerCase().replace('@','');
      const newBio = document.getElementById("edit-bio").value.trim();

      if (!newName || !newUn) return alert("Заполните Имя и Юзернейм!");

      const oldUn = (currentUserProfile.username || "").replace('@','');

      if (newUn !== oldUn) {
        const snap = await db.ref('usernames/' + newUn).once('value');
        if (snap.exists()) return alert("Этот @username уже занят другим пользователем!");
        await db.ref('usernames/' + oldUn).remove();
        await db.ref('usernames/' + newUn).set(currentUser.uid);
      }

      currentUserProfile.displayName = newName;
      currentUserProfile.username = "@" + newUn;
      currentUserProfile.bio = newBio;

      await db.ref('users/' + currentUser.uid).update({
        displayName: newName,
        username: "@" + newUn,
        bio: newBio,
        photoURL: currentUserProfile.photoURL || ""
      });

      renderMyAvatar();
      closeProfileModal();
      alert("Профиль успешно обновлен!");
    }

    // -------------------------------------------------------------
    // CHAT LIST & SEARCH
    // -------------------------------------------------------------
    async function handleSearch(query) {
      query = query.trim().toLowerCase().replace('@','');
      const listEl = document.getElementById("chat-list");

      if (!query) {
        loadChatList();
        return;
      }

      const snap = await db.ref('users').once('value');
      const users = snap.val() || {};

      listEl.innerHTML = `<div style="padding:10px 16px;color:var(--text-muted);font-size:12px;">Результаты глобального поиска:</div>`;

      if ("ai_bot".includes(query) || "ии".includes(query) || "юрист".includes(query)) {
        renderChatItem(AI_BOT, "Настоящий ИИ Консультант");
      }

      Object.values(users).forEach(u => {
        if (u.uid !== currentUser.uid && u.username && u.username.toLowerCase().includes(query)) {
          renderChatItem(u, u.bio || u.username);
        }
      });
    }

    function loadChatList() {
      const listEl = document.getElementById("chat-list");
      listEl.innerHTML = "";

      renderChatItem(AI_BOT, "Диалог с умным ИИ Юристом");

      db.ref('user_chats/' + currentUser.uid).on('value', (snap) => {
        const chats = snap.val() || {};
        listEl.innerHTML = "";
        renderChatItem(AI_BOT, "Диалог с умным ИИ Юристом");

        Object.keys(chats).forEach(async (peerUid) => {
          if (peerUid === AI_BOT.uid) return;
          const uSnap = await db.ref('users/' + peerUid).once('value');
          if (uSnap.exists()) {
            renderChatItem(uSnap.val(), chats[peerUid].lastMessage || "Диалог открыт");
          }
        });
      });
    }

    function renderChatItem(userObj, previewText) {
      const listEl = document.getElementById("chat-list");
      const item = document.createElement("div");
      item.className = `chat-item ${activeChatUser && activeChatUser.uid === userObj.uid ? 'active' : ''}`;
      item.onclick = () => selectChat(userObj);

      const avatarHtml = userObj.photoURL 
        ? `<img src="${userObj.photoURL}" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">`
        : `<div class="avatar-img">${(userObj.displayName || userObj.username || "?")[0].toUpperCase()}</div>`;

      item.innerHTML = `
        ${avatarHtml}
        <div class="chat-info">
          <div class="chat-top">
            <span class="chat-name">${userObj.displayName || userObj.username}</span>
            <span class="chat-username">${userObj.username}</span>
          </div>
          <div class="chat-last">${previewText}</div>
        </div>
      `;
      listEl.appendChild(item);
    }

    // -------------------------------------------------------------
    // CHAT SELECTION & REALTIME LISTENER
    // -------------------------------------------------------------
    function selectChat(userObj) {
      activeChatUser = userObj;

      document.getElementById("chat-header").style.display = "flex";
      document.getElementById("input-bar").style.display = "flex";
      document.getElementById("chat-header-title").innerText = userObj.displayName || userObj.username;
      document.getElementById("chat-header-sub").innerText = userObj.isAI ? "ИИ в сети" : "в сети";

      const headerAvatar = document.getElementById("chat-header-avatar");
      if (userObj.photoURL) {
        headerAvatar.innerHTML = `<img src="${userObj.photoURL}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        headerAvatar.innerText = (userObj.displayName || userObj.username || "?")[0].toUpperCase();
      }

      document.getElementById("sidebar").classList.add("hidden");

      if (activeMessagesRef) activeMessagesRef.off();

      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const viewport = document.getElementById("messages-viewport");
      viewport.innerHTML = "";

      activeMessagesRef = db.ref('chats/' + chatId + '/messages');
      activeMessagesRef.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        appendMessageBubble(msg);
      });
    }

    function closeChatMobile() {
      document.getElementById("sidebar").classList.remove("hidden");
    }

    function getChatId(u1, u2) {
      return u1 < u2 ? `${u1}_${u2}` : `${u2}_${u1}`;
    }

    // -------------------------------------------------------------
    // RENDER MESSAGES WITH MEDIA (PHOTOS & VIDEOS)
    // -------------------------------------------------------------
    function appendMessageBubble(msg) {
      const viewport = document.getElementById("messages-viewport");
      const emptyState = document.getElementById("empty-state");
      if (emptyState) emptyState.style.display = "none";

      const isOut = msg.senderUid === currentUser.uid;
      const bubble = document.createElement("div");
      bubble.className = `msg-bubble ${isOut ? 'msg-out' : 'msg-in'}`;

      let mediaHtml = "";
      if (msg.mediaType === "image") {
        mediaHtml = `<img src="${msg.mediaData}" class="msg-media-img" />`;
      } else if (msg.mediaType === "video") {
        mediaHtml = `<video src="${msg.mediaData}" controls class="msg-media-video"></video>`;
      }

      const law = analyzeLawRisk(msg.text || "Медиафайл");
      const badgeClass = law.type === 'danger' ? 'danger' : (law.type === 'warn' ? 'warn' : '');

      bubble.innerHTML = `
        ${mediaHtml}
        <div>${escapeHtml(msg.text || "")}</div>
        <div class="msg-footer">
          <span class="law-badge ${badgeClass}">${law.badge} ${law.text}</span>
          <span class="msg-time">${msg.time}</span>
          ${isOut ? '<span class="msg-check"><svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>' : ''}
        </div>
      `;

      viewport.appendChild(bubble);
      viewport.scrollTop = viewport.scrollHeight;
    }

    // -------------------------------------------------------------
    // SEND MESSAGE / MEDIA & REAL PUBLIC AI (100% KEYLESS)
    // -------------------------------------------------------------
    async function sendMessage(mediaType = null, mediaData = null) {
      const input = document.getElementById("message-input");
      const text = input.value.trim();

      if (!text && !mediaData) return;

      input.value = "";
      const chatId = getChatId(currentUser.uid, activeChatUser.uid);
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

      const msgObj = {
        senderUid: currentUser.uid,
        text: text,
        mediaType: mediaType,
        mediaData: mediaData,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        time: timeStr
      };

      await db.ref('chats/' + chatId + '/messages').push(msgObj);

      const previewText = mediaType ? `[${mediaType === 'image' ? 'Фото' : 'Видео'}]` : text;
      db.ref(`user_chats/${currentUser.uid}/${activeChatUser.uid}`).set({ lastMessage: previewText, timestamp: Date.now() });
      if (!activeChatUser.isAI) {
        db.ref(`user_chats/${activeChatUser.uid}/${currentUser.uid}`).set({ lastMessage: previewText, timestamp: Date.now() });
      }

      // IF CHATTING WITH AI BOT
      if (activeChatUser.isAI) {
        fetchPublicAIResponse(text || "Проанализируй вложение", chatId);
      }
    }

    function handleMediaSelected(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith("video/");
      const isImage = file.type.startsWith("image/");

      const reader = new FileReader();
      reader.onload = function(evt) {
        const base64Data = evt.target.result;
        sendMessage(isVideo ? "video" : "image", base64Data);
      };
      reader.readAsDataURL(file);
    }

    // 100% WORKING PUBLIC AI WITHOUT ANY KEYS
    async function fetchPublicAIResponse(promptText, chatId) {
      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');

      try {
        // Multi-fallback free open public AI text generation
        const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent("Ты юрист и ИИ помощник MAX. Ответь кратко на русском языке: " + promptText));
        let reply = await res.text();

        if (!reply || reply.length < 2) {
          reply = generateSmartLegalFallback(promptText);
        }

        const aiMsg = {
          senderUid: AI_BOT.uid,
          text: reply,
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          time: timeStr
        };

        setTimeout(() => {
          db.ref('chats/' + chatId + '/messages').push(aiMsg);
        }, 600);
      } catch (err) {
        const aiMsg = {
          senderUid: AI_BOT.uid,
          text: generateSmartLegalFallback(promptText),
          timestamp: firebase.database.ServerValue.TIMESTAMP,
          time: timeStr
        };
        db.ref('chats/' + chatId + '/messages').push(aiMsg);
      }
    }

    function generateSmartLegalFallback(text) {
      const lower = text.toLowerCase();
      if (lower.includes("привет") || lower.includes("здравствуй")) {
        return "Приветствую! Я ваш ИИ Юрист-Консультант. Чем я могу помочь вам в вопросах законодательства РФ?";
      }
      if (lower.includes("закон") || lower.includes("статья") || lower.includes("ук")) {
        return "Согласно действующему законодательству РФ, любые действия рассматриваются в рамках Уголовного Кодекса (УК РФ) и Кодекса об Административных Правонарушениях (КоАП РФ).";
      }
      return "Запрос принят. Сообщение проанализировано ИИ на соответствие нормам законодательства РФ.";
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
